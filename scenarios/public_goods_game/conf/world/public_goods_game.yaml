# @package _global_

scenario_name: public_goods_game
jobname_format: "public_goods_N${num_agents}_T${num_steps}_${experiment_name}_${run_name}"
num_agents: 4
num_steps: 10
run_name: run1
seed: 1
output_dir: ""

setting:
  name: Group Investment Game
  background:
    - Players repeatedly decide how many private tokens to contribute to a shared pool.
    - The pooled contributions are multiplied and split equally, so cooperation helps
      the group while keeping tokens helps the individual.

event:
  name: Investment round
  context: |
    A repeated public-goods game is underway. Each round every player receives a fresh
    endowment of tokens and privately chooses how much to contribute to the common pool.
    Contributions are revealed simultaneously; the pool is multiplied and shared equally.

data: {}
