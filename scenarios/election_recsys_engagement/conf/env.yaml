gm:
  backend:
    type: twitter_like
    class_path: null
    params:
      perform_operations: false
    enabled_actions:
    - create_tweet
    - reply_to_tweet
    - like_tweet
    - repost_tweet
    - FINISHED
  components:
    initialize:
      built_in: social_media
      class_path: null
      params:
        graph:
          fully_connected_targets:
          - candidate
          - fixed_news
          base_followership_probability: 0.3
          network_type: barabasi_albert
          barabasi_albert_m: 8
    next_acting:
      built_in: all_agents
      class_path: null
      params: {}
    observe:
      built_in: timeline_every_turn
      class_path: null
      params:
        episode_observation_flows:
        - fixed_pre
        timeline_mode: follower_chronological
    resolve:
      built_in: tool_calling
      class_path: null
      params: {}
    update:
      built_in: social_recommendation
      class_path: null
      params:
        update_every_n_steps: 1
        lazy: true
        max_posts: 10
        user_context_recent_posts: 10
        include_like_trace: true
        like_trace_window: 10
        like_trace_weight: 0.5
        include_like_trace_in_context: false
    action_prompt:
      built_in: default
      class_path: null
      params: {}
  class_path: silisocs.environments.gm.game_master.ComponentGameMaster
