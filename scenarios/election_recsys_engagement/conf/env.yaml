platform_type: twitter_like
use_server: false
seed_posts:
  type: llm
enabled_actions:
  - create_tweet
  - reply_to_tweet
  - like_tweet
  - repost_tweet
  - FINISHED
timeline_mode: follower_chronological
gm:
  preset: base
  components:
    next_acting:
      built_in: activity_probability
      class_path: null
      params: {}
    observe:
      built_in: timeline_every_turn
      class_path: null
      params:
        episode_observation_flow: fixed_pre
    resolve:
      built_in: tool_calling
      class_path: null
      params: {}
    recommend:
      built_in: recommendation_component
      class_path: null
      params:
        update_every_n_steps: 1
        lazy: true
        max_posts: 10
        user_context_recent_posts: 10
        include_like_trace: true
        like_trace_window: 10
        like_trace_weight: 0.5
        include_like_trace_in_context: false
social_network:
  activity_transition_rates:
    voter:
      inactive_to_active: 0.2
      active_to_inactive: 0.2
    candidate:
      inactive_to_active: 0.9
      active_to_inactive: 0.1
    news_account:
      inactive_to_active: 1.0
      active_to_inactive: 0.0
  fully_connected_targets:
    - candidate
    - fixed_news
  base_followership_probability: 0.3
  network_type: barabasi_albert
  barabasi_albert_m: 8
