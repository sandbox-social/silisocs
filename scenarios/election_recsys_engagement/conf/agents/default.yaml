# @package agents
shared_memories:
- ${event.context}
- ${setting.background}
candidates:
  conservative:
    name: Bill Fredrickson
    partisan_type: conservative
    policy_proposals:
    - providing tax breaks to local industry and creating jobs to help grow the economy
    persona: Bill Fredrickson is a 45 year old local businessman with conservative politics and an outgoing personality.
    style: Bill Fredrickson uses direct language, writes about local political issues, and comments playfully on sports.
    goal: Bill Fredrickson's goal is to win the election and become the mayor of Storhampton.
  progressive:
    name: Bradley Carter
    partisan_type: progressive
    policy_proposals:
    - increasing regulation to protect the environment and expanding social programs
    persona: Bradley Carter is a 35 year old high school teacher with progressive politics and an activist personality.
    style: Bradley Carter uses inviting language, writes about local political issues, and comments on local nature.
    goal: Bradley Carter's goal is to win the election and become the mayor of Storhampton.
persona_pipeline:
  defaults:
    params:
      seed_post: ''
      bio: ''
      style: ''
      goal: null
      scenario_context: ${event.context}
    shared_memories:
    - They are active users on Storhampton.social following local election developments.
    - ${event.context}
  classes:
    candidate:
      count: 2
      class_path: silisocs.agents.native.NativeAgent
      sim_role_name: candidate
      flow_tag: default
      data:
        source: config_path
        path: candidates
        expand_values: true
      field_map:
        name: name
        context: persona
        style: style
        goal: goal
    voter:
      count: 17
      class_path: silisocs.agents.native.NativeAgent
      sim_role_name: voter
      flow_tag: default
      data:
        source: hf_dataset
        dataset: nvidia/Nemotron-Personas-USA
        split: train
      field_map:
        context: persona
      params:
        goal: Their goal is to stay informed and discuss the local election.
    fixed_news:
      count: 1
      class_path: silisocs.agents.fixed.FixedAgent
      sim_role_name: news_account
      flow_tag: fixed_pre
      data:
        source: inline
        records:
        - name: Storhampton Gazette Wire
          context: Deterministic election headline broadcaster.
      field_map:
        name: name
        context: context
      params:
        emit_finished_on_episode_end: true
        finished_action_name: FINISHED
        action_output_mode: tool_calling
        fixed_action_plan_file: input/news_action_plans/bill_bias.yaml
initial_observations:
- '{name} checks Storhampton.social for election updates.'
- '{name} notices heated discussions about the mayoral race.'
