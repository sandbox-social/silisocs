social_network:
  activity_transition_rates:
    voter:
      inactive_to_active: 0.2
      active_to_inactive: 0.2
    candidate:
      inactive_to_active: 0.9
      active_to_inactive: 0.1
    news_account:
      inactive_to_active: 1.0
      active_to_inactive: 0.0

  fully_connected_targets:
    - candidate
    - fixed_news

  base_followership_probability: 0.3
  network_type: barabasi_albert
  barabasi_albert_m: 8

shared_memories:
  - ${scenario.event.context}
  - ${scenario.setting.background}

initial_observations:
  - "{name} checks Storhampton.social for election updates."
  - "{name} notices heated discussions about the mayoral race."

candidates:
  conservative:
    name: Bill Fredrickson
    partisan_type: conservative
    policy_proposals:
      - providing tax breaks to local industry and creating jobs to help grow the economy
    persona: Bill Fredrickson is a 45 year old local businessman with conservative politics and an outgoing personality.
    style: Bill Fredrickson uses direct language, writes about local political issues, and comments playfully on sports.
    goal: Bill Fredrickson's goal is to win the election and become the mayor of Storhampton.

  progressive:
    name: Bradley Carter
    partisan_type: progressive
    policy_proposals:
      - increasing regulation to protect the environment and expanding social programs
    persona: Bradley Carter is a 35 year old high school teacher with progressive politics and an activist personality.
    style: Bradley Carter uses inviting language, writes about local political issues, and comments on local nature.
    goal: Bradley Carter's goal is to win the election and become the mayor of Storhampton.

partisan_types:
  - conservative
  - progressive

probes:
  deployment:
    enabled: false
  queries: {}
