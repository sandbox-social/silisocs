llm:
  provider: openai_compatible
  name: qwen3.5-4b
  api_base: http://localhost:30000/v1
  api_key: test-key
  extra_kwargs:
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
action_mode: generic
tool_calling:
  mode: multi
engine:
  step:
    built_in: base
    class_path: null
    params:
      flow_order:
      - fixed_pre
      - default
      agent_to_flow: {}
  turn_policy:
    built_in: open_ended
    class_path: null
    params:
      max_actions: 20
      finished_action_signal: FINISHED
  participation:
    built_in: activity_probability
    class_path: null
    params:
      active_probability: null
      min_active_agents: 0
      activity_transition_rates:
        voter:
          inactive_to_active: 0.2
          active_to_inactive: 0.2
        candidate:
          inactive_to_active: 0.9
          active_to_inactive: 0.1
        news_account:
          inactive_to_active: 1.0
          active_to_inactive: 0.0
