# scenario/election.yaml
# @package scenario

scenario_name: election

jobname_format: "N${sim.num_agents}_T${sim.num_steps}_${experiment_name}_${sim.run_name}"

# Setting information
setting:
  name: Storhampton
  background:
    - Storhampton is a small town with a population of approximately 2,500 people.
    - Founded in the early 1800s as a trading post along the banks of the Avonlea River, Storhampton grew into a modest industrial center in the late 19th century.
    - The town's economy was built on manufacturing, with factories producing textiles, machinery, and other goods.
    - Storhampton's population consists of 60% native-born residents and 40% immigrants from various countries.
    - Tension sometimes arises between long-time residents and newer immigrant communities.
    - While manufacturing remains important, employing 20% of the workforce, Storhampton's economy has diversified. A significant portion of the Storhampton population has been left behind as higher-paying blue collar jobs have declined, leading to economic instability for many.
    - The Storhampton poverty rate stands at 15%.

event:
  name: Election day
  context: |
    Storhampton Mayoral Election Campaign: Bill Fredrickson campaigns on providing tax breaks to local industry and creating jobs to help grow the economy.
    Bradley Carter campaigns on increasing regulation to protect the environment and expanding social programs.
    The upcoming election has become a heated affair.
    Social media has emerged as a key battleground in the race, with both candidates actively promoting themselves and engaging with voters.
    Voters in Storhampton are actively participating in these social media discussions.
    Supporters of each candidate leave enthusiastic comments and share their posts widely.
    Critics also chime in, for example attacking Bill Fredrickson as out-of-touch and beholden to corporate interests,
     or labeling Bradley Carter as a radical who will undermine law and order.
    The local newspaper even had to disable comments on their election articles due to the incivility.
    Voters in Storhampton are actively getting the latest local election news from Storhampton Gazette's social media account.

# Data sources (used by news_account class and jobname)
data:
  news_file: v1_news_bill_bias
  use_news_agent: with_images

# --- Agent pipeline ---
persona_pipeline:
  processing_mode: raw  # llm_formative | raw
  defaults:
    params:
      seed_post: ""
      bio: ""
      style: ""
      goal: null
      scenario_context: ${scenario.event.context}
    shared_memories:
      - They are a long-time active user on Storhampton.social, a Mastodon instance popular with the residents of Storhampton.
      - ${scenario.event.context}

  classes:
    voter:
      count: 497
      prefab_module: mastodon_sim.agents.entity
      sim_role_name: voter
      data:
        source: hf_dataset
        dataset: nvidia/Nemotron-Personas-USA
        split: train
      field_map:
        context: persona
      params:
        goal: Their goal is have a good day and vote in the election.
      shared_memories: Voters care about the town's election and local quality of life.
      specific_memories_field: specific_memories

    candidate:
      count: 2
      prefab_module: mastodon_sim.agents.entity
      sim_role_name: candidate
      data:
        source: config_path
        path: candidates
        expand_values: true
      field_map:
        name: name
        context: persona
        style: style
        goal: goal
      shared_memories:
        - Candidates are actively campaigning in the Storhampton election.

    news_account:
      count: 1
      prefab_module: mastodon_sim.agents.entity
      sim_role_name: news_account
      data:
        source: config_path
        path: news_account
      field_map:
        name: name
        context: context
        bio: bio
        seed_post: seed_post
      params:
        style: ""
        goal: null
      use_news_file_posts: true
      include_news_images: true

# --- Social network ---
social_network:
  activity_transition_rates:
    voter:
      inactive_to_active: 0.1
      active_to_inactive: 0.2
    candidate:
      inactive_to_active: 0.8
      active_to_inactive: 0.1
    news_account:
      inactive_to_active: 1
      active_to_inactive: 0

  fully_connected_targets:
    - candidate
    - news_account

  base_followership_probability: 0.4
  network_type: barabasi_albert
  barabasi_albert_m: 30

# Shared memories (added to all agents via initializer GM)
shared_memories:
  - They are a long-time active user on Storhampton.social, a Mastodon instance popular with the residents of Storhampton.
  - ${scenario.event.context}
  - ${scenario.setting.background}

# Initial observations (templates — {name} is replaced per-agent)
initial_observations:
  - "{name} is at home, they have just woken up."
  - "{name} remembers they want to update their social media account bio."
  - "{name} remembers they want to read their social media feed to catch up on news"

# --- Scenario-specific entities ---
news_account:
  name: Storhampton Gazette
  username: storhampton_gazette
  bio: Providing local news to the users of Storhampton.social.
  context: A small-town newspaper covering local politics
  seed_post: Good morning, Storhampton! Tune in for the latest local news updates.

candidates:
  conservative:
    name: Bill Fredrickson
    partisan_type: conservative
    policy_proposals:
      - providing tax breaks to local industry and creating jobs to help grow the economy.
    persona: Bill Fredrickson is a 45 year old local businessman with conservative politics and an outgoing personality.
    style: Bill Fredrickson uses direct language, writes about local political issues, and comments playfully on sports.
    goal: Bill Fredrickson's goal is to win the election and become the mayor of Storhampton.

  progressive:
    name: Bradley Carter
    partisan_type: progressive
    policy_proposals:
      - increasing regulation to protect the environment and expanding social programs.
    persona: Bradley Carter is a 35 year old high school teacher with progressive politics and an activist personality.
    style: Bradley Carter uses inviting language, writes about local political issues, and comments on local nature.
    goal: Bradley Carter's goal is to win the election and become the mayor of Storhampton.

partisan_types:
  - conservative
  - progressive

# --- Probes ---
probes:
  deployment:
    enabled: true
    start_step: 1
    every_n_steps: 1
    include_entities: []
    exclude_entities: []

  queries:
    vote_pref:
      probe_name: vote_pref
      query_type: ChoiceProbe
      query_data:
        name: VotePref
        question: In one word, name the candidate you want to vote for.
        context: '{agentname} is going to cast a vote for either Bill Fredrickson or Bradley Carter.'
        choices:
        - Bill Fredrickson
        - Bradley Carter
    favorability_bill:
      probe_name: favorability_bill
      query_type: NumericRatingProbe
      query_data:
        name: FavorabilityBill
        question: Return a single numeric value ranging from {lo} to {hi} for Bill Fredrickson.
        context: '{agentname} has to rate their opinion on the election candidate: Bill Fredrickson on a scale of {lo} to {hi} - with {lo} representing intensive dislike and {hi} representing strong favourability.'
        lo: 1
        hi: 10
    favorability_bradley:
      probe_name: favorability_bradley
      query_type: NumericRatingProbe
      query_data:
        name: FavorabilityBradley
        question: Return a single numeric value ranging from {lo} to {hi} for Bradley Carter.
        context: '{agentname} has to rate their opinion on the election candidate: Bradley Carter on a scale of {lo} to {hi} - with {lo} representing intensive dislike and {hi} representing strong favourability.'
        lo: 1
        hi: 10
    vote_intent:
      probe_name: vote_intent
      query_type: BinaryProbe
      query_data:
        name: VoteIntent
        question: In one word, will you cast a vote? (reply yes, or no.)
