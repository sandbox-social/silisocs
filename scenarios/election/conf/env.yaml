gm:
  backend:
    type: twitter_like
    class_path: null
    params: {}
    enabled_actions: null
  class_path: silisocs.environments.gm.game_master.ComponentGameMaster
  components:
    initialize:
      built_in: social_media
      class_path: null
      params:
        graph:
          fully_connected_targets:
          - candidate
          - news_account
          base_followership_probability: 0.4
          network_type: barabasi_albert
          barabasi_albert_m: 30
    next_acting:
      built_in: activity_probability
      class_path: null
      params:
        activity_transition_rates:
          voter:
            inactive_to_active: 0.1
            active_to_inactive: 0.2
          candidate:
            inactive_to_active: 0.8
            active_to_inactive: 0.1
          news_account:
            inactive_to_active: 1
            active_to_inactive: 0
    observe:
      built_in: timeline_every_turn
      class_path: null
      params: {}
    update:
      built_in: social_recommendation
      class_path: null
      params: {}
    action_prompt:
      built_in: default
      class_path: null
      params: {}
    resolve:
      built_in: tool_calling
      class_path: null
      params: {}
