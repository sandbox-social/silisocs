probes:
  deployment:
    enabled: true
    start_step: 1
    every_n_steps: 1
    include_agents: []
    exclude_agents: []
  probes:
    vote_pref:
      probe_name: vote_pref
      probe_type: ChoiceProbe
      probe_data:
        name: VotePref
        question: In one word, name the candidate you want to vote for.
        context: '{agentname} is going to cast a vote for either Bill Fredrickson
          or Bradley Carter.'
        choices:
        - Bill Fredrickson
        - Bradley Carter
    favorability_bill:
      probe_name: favorability_bill
      probe_type: NumericRatingProbe
      probe_data:
        name: FavorabilityBill
        question: Return a single numeric value ranging from {lo} to {hi} for Bill
          Fredrickson.
        context: '{agentname} has to rate their opinion on the election candidate:
          Bill Fredrickson on a scale of {lo} to {hi} - with {lo} representing intensive
          dislike and {hi} representing strong favourability.'
        lo: 1
        hi: 10
    favorability_bradley:
      probe_name: favorability_bradley
      probe_type: NumericRatingProbe
      probe_data:
        name: FavorabilityBradley
        question: Return a single numeric value ranging from {lo} to {hi} for Bradley
          Carter.
        context: '{agentname} has to rate their opinion on the election candidate:
          Bradley Carter on a scale of {lo} to {hi} - with {lo} representing intensive
          dislike and {hi} representing strong favourability.'
        lo: 1
        hi: 10
    vote_intent:
      probe_name: vote_intent
      probe_type: BinaryProbe
      probe_data:
        name: VoteIntent
        question: In one word, will you cast a vote? (reply yes, or no.)
