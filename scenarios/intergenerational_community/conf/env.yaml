platform_type: twitter_like
enabled_actions:
- create_tweet
- reply_to_tweet
- like_tweet
- repost_tweet
- FINISHED
timeline_mode: follower_chronological
gm:
  preset: base
  components:
    initialize:
      built_in: social_media
      class_path: null
      params: {}
    next_acting:
      built_in: activity_probability
      class_path: null
      params: {}
    observe:
      built_in: timeline_every_turn
      class_path: null
      params:
        episode_observation_flow: fixed_pre
    resolve:
      built_in: tool_calling
      class_path: null
      params: {}
social_network:
  activity_transition_rates:
    senior:
      inactive_to_active: 0.6
      active_to_inactive: 0.3
    middle_aged_resident:
      inactive_to_active: 0.7
      active_to_inactive: 0.2
    young_adult:
      inactive_to_active: 0.7
      active_to_inactive: 0.2
    teen:
      inactive_to_active: 0.5
      active_to_inactive: 0.4
  fully_connected_targets: []
  base_followership_probability: 0.5
  network_type: barabasi_albert
  barabasi_albert_m: 2
