      count: 2
      prefab_module: silisocs.agents.entity
      sim_role_name: senior
      data:
        source: inline
        records:
        - name: Dorothy Hawkins
          username: dorothy_hawkins
          context: Dorothy Hawkins is a social media user.
          seed_post: ''
