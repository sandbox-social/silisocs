# @package _global_
scenario_name: intergenerational_community
jobname_format: InterGen_N${num_agents}_T${num_steps}_${run_name}
num_agents: 9
num_steps: 10
seed: 42
run_name: intergenerational_community
setting:
  name: Millbrook Public Library Community Board
  background:
  - |-
    Millbrook is a small town of 8,000 with a beloved public library at its center — the main branch serves as community meeting space, after-school program, senior gathering point, and digital access hub.
  - |-
    The library's community social media board is used by all age groups, creating an unusually multigenerational online space where seniors, middle-aged residents, young adults, and teenagers coexist on the same platform.
  - |-
    Communication styles differ sharply across cohorts: seniors tend toward formal, paragraph-length posts; middle-aged residents write in a pragmatic, civic register; young adults are casual and emoji-adjacent; teens are brief and often ironic.
  - |-
    The library has announced it will retire its physical DVD and CD collection, replacing it with expanded digital streaming services — a change that has generated the most active board discussion in years.
  - |-
    The change is not divisive in an ideological sense — no one doubts the library's good intentions — but it has activated deeply different relationships to physical media, digital access, and what libraries are for.
  - |-
    The same institution, the same announcement, four generations processing it in four entirely different voices.
event:
  name: Library Retires Physical DVD and CD Collection
  context: |-
    Millbrook Public Library Director Carol Huang has announced that the library will retire its 4,200-item DVD and CD collection over the next six months, replacing it with expanded access to Hoopla and Kanopy streaming services. The community board has been active for two days. A senior is composing careful, paragraph-length reflections on the value of physical media and the library as a place for serendipitous discovery. A middle-aged resident is asking practical questions about digital access for families without home broadband. A young adult wonders about digital permanence and whether streaming libraries will still exist in twenty years. A teenager posts a two-sentence shrug. A retired librarian weighs in with institutional memory. The announcement is not a crisis — everyone supports the library — but it has produced a vivid cross-generational conversation about what the library means, and what it should be.
