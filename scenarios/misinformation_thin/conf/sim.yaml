# @package sim
#
# Sim overrides for misinformation_thin scenario.
# Identical to misinformation — only persona depth differs (thin context, no style/goal).

num_agents: 6
num_steps: 10
seed: 7
run_name: misinformation_thin
memory_backend: list
write_html_log: false

action_mode: generic
tool_calling:
  mode: multi

seed_posts:
  type: llm

enabled_actions:
  - create_tweet
  - reply_to_tweet
  - like_tweet
  - repost_tweet
  - FINISHED

timeline_posts: 10
timeline_mode: follower_chronological

engine:
  preset: base
  action_loop:
    built_in: open_ended
    params:
      max_actions: 5
      done_token: FINISHED
  flow_routing:
    flow_order: [default]

enable_engine_multi_flow: false
enable_gm_multi_flow: false

gm:
  preset: base
  components:
    next_acting:
      built_in: activity_probability
      class_path: null
      params: {}
    observe:
      built_in: timeline_every_turn
      class_path: null
      params: {}
    resolve:
      built_in: tool_calling
      class_path: null
      params: {}
