platform_type: twitter_like
seed_posts:
  type: llm
enabled_actions:
  - create_tweet
  - reply_to_tweet
  - like_tweet
  - repost_tweet
  - FINISHED
timeline_mode: follower_chronological
gm:
  preset: base
  components:
    next_acting:
      built_in: activity_probability
      class_path: null
      params: {}
    observe:
      built_in: timeline_every_turn
      class_path: null
      params: {}
    resolve:
      built_in: tool_calling
      class_path: null
      params: {}
social_network:
  network_type: predefined
  predefined_graph:
    Alice:
      - Bob
      - Charlie
      - Diana
    Bob:
      - Alice
      - Charlie
    Charlie:
      - Alice
      - Bob
      - Diana
    Diana:
      - Alice
      - Bob
      - Charlie
      - Eve
    Eve:
      - Alice
      - Diana
    Frank:
      - Bob
      - Charlie
      - Eve
  activity_transition_rates:
    user:
      inactive_to_active: 0.8
      active_to_inactive: 0.1
  fully_connected_targets: []
  base_followership_probability: 0.0
