# OASIS Preset Configuration
# Load OASIS-specific defaults instead of standard defaults
#
# Usage: --config-path scenarios/oasis_*/conf
# Each scenario's config.yaml inherits from this and overrides social_media

defaults:
  - oasis/sim: oasis_base  # OASIS simulation base config (local copy)
  # NOTE: social_media is NOT specified here - MUST be overridden by parent config!
  # This allows Reddit and Twitter OASIS scenarios to use their respective platforms
  - scenario: oasis_preset
  - _self_

hydra:
  job:
    name: ${scenario.jobname_format}_${now:%Y-%m-%d_%H-%M-%S}
  run:
    dir: scenarios/${scenario.scenario_name}/outputs/${scenario.jobname_format}
  output_subdir: configs/${scenario.jobname_format}

experiment_name: oasis_preset
