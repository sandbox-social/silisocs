gm:
  backend:
    type: twitter_like
    class_path: null
    params: {}
    enabled_actions:
    - create_tweet
    - reply_to_tweet
    - like_tweet
    - repost_tweet
    - FINISHED
  components:
    initialize:
      built_in: social_media
      class_path: null
      params:
        graph:
          network_type: predefined
          predefined_graph:
            Alice:
            - Bob
            - Charlie
            - Diana
            Bob:
            - Alice
            - Charlie
            Charlie:
            - Alice
            - Bob
            - Diana
            Diana:
            - Alice
            - Bob
            - Charlie
            - Eve
            Eve:
            - Alice
            - Diana
            Frank:
            - Bob
            - Charlie
            - Eve
          fully_connected_targets: []
          base_followership_probability: 0.0
    next_acting:
      built_in: activity_probability
      class_path: null
      params:
        activity_transition_rates:
          user:
            inactive_to_active: 0.8
            active_to_inactive: 0.1
    observe:
      built_in: timeline_every_turn
      class_path: null
      params:
        timeline_mode: follower_chronological
    resolve:
      built_in: tool_calling
      class_path: null
      params: {}
    update:
      built_in: social_recommendation
      class_path: null
      params: {}
    action_prompt:
      built_in: default
      class_path: null
      params: {}
  class_path: silisocs.environments.gm.game_master.ComponentGameMaster
