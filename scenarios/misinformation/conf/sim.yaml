# @package sim
#
# Sim overrides for misinformation scenario.
# 6 named agents, one action per step, explicit follower graph.

num_agents: 6
num_steps: 10
seed: 7
run_name: misinformation
memory_backend: list
write_html_log: false

action_mode: generic
tool_calling:
  mode: multi

# LLMSeedPostProvider uses agent.seed_post directly for Alice, Bob, Charlie.
# Diana, Eve, Frank have empty seed_posts so will get LLM-generated opening posts.
seed_posts:
  type: llm

enabled_actions:
  - create_tweet
  - reply_to_tweet
  - like_tweet
  - repost_tweet
  - FINISHED

# Simple chronological timeline — small network, no recommendations needed
timeline_posts: 10
timeline_mode: follower_chronological

engine:
  preset: base
  action_loop:
    built_in: open_ended
    params:
      max_actions: 5
      done_token: FINISHED
  flow_routing:
    flow_order: [default]

enable_engine_multi_flow: false
enable_gm_multi_flow: false

gm:
  preset: base
  components:
    next_acting:
      built_in: activity_probability
      class_path: null
      params: {}
    observe:
      built_in: timeline_every_turn
      class_path: null
      params: {}
    resolve:
      built_in: tool_calling
      class_path: null
      params: {}
