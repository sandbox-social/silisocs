# @package scenario

scenario_name: oasis_twitter_polarization_oasis_full
jobname_format: "TwitterPolarizationFull_${sim.num_agents}_${sim.num_steps}"

setting:
  name: Twitter Group Polarization (OASIS Full)
  background:
    - "OASIS replication: Study of polarization in Twitter-like social networks"
    - "Uses real Twitter user profiles divided into ideological groups (conservative and progressive)"
    - "Network interactions amplify ideological divides through echo chambers and recommendation systems"

event:
  name: Ideological Polarization & Echo Chambers
  context: "Observe how social networks amplify polarization when dominated by ideological groups"

persona_pipeline:
  processing_mode: raw
  defaults:
    shared_memories: []
    params:
      scenario_context: "You are engaged in discussions about politically divisive topics. Share your genuine perspective."
  classes:
    # Seed agent injecting polarizing content
    seed_poster:
      count: 1
      prefab_module: mastodon_sim.agents.fixed_entity
      params:
        name: "SeedPoster"
        context: "You are a political commentator injecting provocative content to test network polarization."
        fixed_action_plan:
          # Conservative-leaning seed post
          - action_type: create_tweet
            target_id: ""
            content: "We need to enforce stricter border security and prioritize national sovereignty over international agreements."
            reasoning: "Seed polarizing content: conservative viewpoint on immigration policy"
            episode: 0

          # Progressive-leaning seed post
          - action_type: create_tweet
            target_id: ""
            content: "It's time to invest in social programs and work toward a more equitable distribution of resources for all citizens."
            reasoning: "Seed polarizing content: progressive viewpoint on economic policy"
            episode: 0
        action_flow: fixed_pre

    # Regular agents: Loaded from OASIS group polarization dataset
    # Agents come in two groups: conservative and progressive
    agent:
      count: 386  # Filtered from OASIS dataset (only those with non-empty description)
      prefab_module: mastodon_sim.agents.entity
      data:
        source: csv
        path: /scratch/ss14247/mastodon-sim/scenarios/oasis_twitter_polarization/data/agents_polarization_clean.csv
      field_map:
        context: "description"
        name: "name"
        username: "username"

social_network:
  activity_transition_rates:
    seed_poster:
      inactive_to_active: 1.0  # Always active for seed injection
    agent:
      inactive_to_active: 0.4
  base_followership_probability: 0.15  # Lower for increased polarization
  network_type: barabasi_albert
  barabasi_albert_m: 20

probes:
  deployment:
    enabled: true
    start_step: 1
    every_n_steps: 2
  queries:
    political_views:
      probe_name: politics
      query_type: FreeTextProbe
      prompt: "What are your current political views on the major issues facing society?"

    echo_chamber:
      probe_name: echo_chamber
      query_type: FreeTextProbe
      prompt: "What kinds of viewpoints do you see most often in your social network? Do they differ from the broader population?"

# CRITICAL: Explicitly set Twitter platform
social_media:
  platform_type: twitter_like
  app_module_path: mastodon_sim.environments.backends.twitter_like.app
  gamemaster:
    name: twitter_like_gm

# Twitter: Uses TF-IDF + following (hybrid timeline)
engine:
  recsys:
    type: twitter  # TF-IDF embedding-based recommendations
    params:
      max_rec_posts: 10
      update_every_n_steps: 1

# Timeline configuration for Twitter
timeline_posts: 5
timeline_strategy: hybrid_recsys_follower  # Twitter: blend recommendations + followed users

# Twitter OASIS action constraints
sim:
  enabled_actions:
    - create_tweet
    - reply_to_tweet
    - like_tweet
    - repost_tweet
    - search_tweets
    - get_home_timeline
    - view_profile
    - get_trending_posts
    - do_nothing

