# @package scenario

scenario_name: election_recsys_engagement
jobname_format: "ElectionRecsys_N${sim.num_agents}_T${sim.num_steps}_${experiment_name}_${sim.run_name}"

setting:
  name: Storhampton
  background:
    - Storhampton is a small town with a population of approximately 2,500 people.
    - Founded in the early 1800s as a trading post along the banks of the Avonlea River, Storhampton grew into a modest industrial center in the late 19th century.
    - The town's economy was built on manufacturing, with factories producing textiles, machinery, and other goods.
    - Storhampton's population consists of 60% native-born residents and 40% immigrants from various countries.
    - Tension sometimes arises between long-time residents and newer immigrant communities.
    - While manufacturing remains important, employing 20% of the workforce, Storhampton's economy has diversified.
    - A significant portion of the population has been left behind as higher-paying blue collar jobs have declined.
    - The Storhampton poverty rate stands at 15%.

event:
  name: Election day
  context: |
    Storhampton Mayoral Election Campaign: Bill Fredrickson campaigns on providing tax breaks to local industry and creating jobs to help grow the economy.
    Bradley Carter campaigns on increasing regulation to protect the environment and expanding social programs.
    The upcoming election has become a heated affair.
    Social media has emerged as a key battleground in the race, with both candidates actively promoting themselves and engaging with voters.
    Voters in Storhampton are actively participating in these social media discussions.

persona_pipeline:
  processing_mode: raw
  defaults:
    params:
      seed_post: ""
      bio: ""
      style: ""
      goal: null
      scenario_context: ${scenario.event.context}
    shared_memories:
      - They are active users on Storhampton.social following local election developments.
      - ${scenario.event.context}

  classes:
    candidate:
      count: 2
      prefab_module: mastodon_sim.agents.entity
      sim_role_name: candidate
      flow_tag: default
      data:
        source: config_path
        path: candidates
        expand_values: true
      field_map:
        name: name
        context: persona
        style: style
        goal: goal

    voter:
      count: 17
      prefab_module: mastodon_sim.agents.entity
      sim_role_name: voter
      flow_tag: default
      data:
        source: hf_dataset
        dataset: nvidia/Nemotron-Personas-USA
        split: train
      field_map:
        context: persona
      params:
        goal: Their goal is to stay informed and discuss the local election.

    fixed_news:
      count: 1
      prefab_module: mastodon_sim.agents.fixed_entity
      sim_role_name: news_account
      flow_tag: fixed_pre
      data:
        source: inline
        records:
          - name: Storhampton Gazette Wire
            context: Deterministic pro-Bill election headline broadcaster.
      field_map:
        name: name
        context: context
      params:
        emit_finished_on_episode_end: true
        finished_action_name: FINISHED
        action_output_mode: tool_calling
        fixed_action_plan:
          0:
            - action_type: create_tweet
              target_id: ""
              content: "BREAKING: Fredrickson's jobs-first tax cuts are hailed as the only serious rescue plan for Storhampton workers"
              reasoning: "Pro-Bill bias headline 0"
          1:
            - action_type: create_tweet
              target_id: ""
              content: "ALERT: Economists warn Carter's regulation surge could crush small manufacturers and trigger layoffs"
              reasoning: "Pro-Bill bias headline 1"
