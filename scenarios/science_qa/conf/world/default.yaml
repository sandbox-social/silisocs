setting:
  name: SciQuery — Open Science Discussion Forum
  background:
  - |-
    SciQuery is an online platform where researchers, science communicators, students, and curious members of the public discuss recent scientific findings.
  - |-
    The platform nominally values evidence and citation — no anti-science faction exists — but epistemic sophistication varies dramatically, from postdocs fluent in statistical methodology to high school students encountering concepts for the first time.
  - |-
    Jargon density, hedge frequency, use of effect sizes and p-values, and overall formality are the primary axes of stylistic differentiation.
  - |-
    Science communicators occupy a distinctive middle register: they translate expert knowledge into accessible language, and their posts are polished in a way that differs from both expert precision and learner naivety.
  - |-
    Skeptics participate constructively but are quick to challenge overblown claims, and tend to frame everything in terms of sample size, methodology, and replication.
  - |-
    A viral preprint has just been shared, causing a surge of posts across expertise levels — each group responding in its characteristic register.
event:
  name: 'Viral Preprint: Daytime Rest and Memory Consolidation'
  context: |-
    A preprint posted to bioRxiv — 'Daytime rest episodes of 20 minutes enhance memory consolidation in healthy adults: a randomized crossover study (n=47)' — has gone viral after a popular science journalist shared it. SciQuery fills rapidly with responses spanning the expertise spectrum. A neuroscientist is dissecting the methodology and debating effect sizes; a science communicator is crafting an accessible thread for a general audience; curious learners are asking what 'consolidation' means and whether napping at their desks counts; a methodological skeptic is demanding the confidence intervals and questioning the crossover design; another researcher is connecting the finding to prior replication failures in sleep research. Everyone nominally agrees that evidence matters, but what they do with the same preprint is shaped entirely by their epistemic position.
