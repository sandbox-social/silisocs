action_mode: generic
tool_calling:
  mode: multi
engine:
  step:
    built_in: base
    class_path: null
    params:
      flow_order:
      - fixed_pre
      - default
      agent_to_flow: {}
  turn_policy:
    built_in: open_ended
    class_path: null
    params:
      max_actions: 10
      finished_action_signal: FINISHED
  participation:
    built_in: activity_probability
    class_path: null
    params:
      active_probability: null
      min_active_agents: 0
      activity_transition_rates:
        researcher:
          inactive_to_active: 0.8
          active_to_inactive: 0.1
        science_communicator:
          inactive_to_active: 0.8
          active_to_inactive: 0.2
        curious_learner:
          inactive_to_active: 0.6
          active_to_inactive: 0.3
        skeptic:
          inactive_to_active: 0.7
          active_to_inactive: 0.2
