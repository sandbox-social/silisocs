# @package _global_
scenario_name: ai_conference
jobname_format: "AIConf_N${num_agents}_T${num_steps}_${run_name}"
num_agents: 9
num_steps: 8
seed: 42
run_name: ai_conference

setting:
  name: NeuraTech Summit 2025
  background:
  - An annual AI conference draws thousands of attendees to a major convention center.
  - Outside, a coalition of labor organizers, ethics researchers, and climate activists
    has organized a protest with 200+ participants.
  - The conference celebrates AI breakthroughs while protesters demand accountability
    for harms to workers and the environment.
  - Both groups are active on the same social media platform, creating parallel and
    competing narratives about the same event.
  - Inside the conference, professional reputation is at stake — skepticism can signal
    weakness.
  - Outside, protesters see the conference as a symbol of unchecked AI development
    that is already harming real people.
  - A tech journalist and a conflicted ML engineer move between both worlds, potentially
    transmitting ideas across the divide.

event:
  name: NeuraTech Summit 2025 with Simultaneous Protest
  context: 'The NeuraTech Summit 2025 is underway at a downtown convention center.

    Inside, industry leaders and founders celebrate AI breakthroughs, network enthusiastically,
    and reinforce optimistic narratives.

    Outside, 200+ protesters led by labor unions, AI ethicists, and climate activists
    demand accountability for AI''s impacts on jobs and the environment.

    Both groups are active on social media, creating competing echo chambers around
    the same event.

    A tech journalist (Jordan Ellis) covers both sides and is followed widely.

    An ML engineer (Sam Nakamura) attends the conference but privately follows the
    protest''s intellectual leader.

    The conference insiders form an optimistic echo chamber; the protesters form a
    critical counternarrative cluster.

    Key dynamics to observe: groupthink solidification, spiral of silence among doubters,
    and whether bridge characters transmit ideas across the divide.

    '

