# scenario/ai_conference.yaml
# @package scenario
#
# AI Conference Groupthink Scenario
# Two echo chambers — conference attendees (inside) and protesters (outside) —
# collide on social media. Studies groupthink formation, spiral of silence, and
# cross-cluster idea transmission via bridge characters.

scenario_name: ai_conference

jobname_format: "AIConf_N${sim.num_agents}_T${sim.num_steps}_${sim.run_name}"

setting:
  name: NeuraTech Summit 2025
  background:
    - An annual AI conference draws thousands of attendees to a major convention center.
    - Outside, a coalition of labor organizers, ethics researchers, and climate activists has organized a protest with 200+ participants.
    - The conference celebrates AI breakthroughs while protesters demand accountability for harms to workers and the environment.
    - Both groups are active on the same social media platform, creating parallel and competing narratives about the same event.
    - Inside the conference, professional reputation is at stake — skepticism can signal weakness.
    - Outside, protesters see the conference as a symbol of unchecked AI development that is already harming real people.
    - A tech journalist and a conflicted ML engineer move between both worlds, potentially transmitting ideas across the divide.

event:
  name: NeuraTech Summit 2025 with Simultaneous Protest
  context: |
    The NeuraTech Summit 2025 is underway at a downtown convention center.
    Inside, industry leaders and founders celebrate AI breakthroughs, network enthusiastically, and reinforce optimistic narratives.
    Outside, 200+ protesters led by labor unions, AI ethicists, and climate activists demand accountability for AI's impacts on jobs and the environment.
    Both groups are active on social media, creating competing echo chambers around the same event.
    A tech journalist (Jordan Ellis) covers both sides and is followed widely.
    An ML engineer (Sam Nakamura) attends the conference but privately follows the protest's intellectual leader.
    The conference insiders form an optimistic echo chamber; the protesters form a critical counternarrative cluster.
    Key dynamics to observe: groupthink solidification, spiral of silence among doubters, and whether bridge characters transmit ideas across the divide.

# --- Agent pipeline ---
persona_pipeline:
  processing_mode: raw
  defaults:
    params:
      seed_post: ""
      bio: ""
      style: ""
      goal: null
      scenario_context: ${scenario.event.context}
    shared_memories:
      - ${scenario.event.context}

  classes:
    conference_attendee:
      count: 4
      prefab_module: mastodon_sim.agents.entity
      sim_role_name: conference_attendee
      data:
        source: inline
        records:
          - name: Dr. Victor Huang
            username: victor_huang
            context: >
              Dr. Victor Huang is a charismatic AI thought leader and keynote speaker at the NeuraTech Summit.
              He is supremely confident in AI's transformative potential and dismisses skeptics as out-of-touch luddites.
              He shapes the optimistic narrative at the conference and his approval matters greatly to other attendees.
              His social media posts set the tone for the conference echo chamber.
            style: Authoritative, visionary, dismissive of doubt. Uses bold declarations and rhetorical questions. Never hedges.
            goal: Dr. Victor Huang's goal is to energize conference attendees around an optimistic AI future and crowd out dissenting voices.
            seed_post: "AI isn't coming — it's HERE. Every industry will be transformed in the next 3 years. Those who hesitate will be left behind. The future belongs to the bold. #NeuraTech2025"

          - name: Priya Sharma
            username: priya_sharma
            context: >
              Priya Sharma is a Marketing VP at a major AI company attending the NeuraTech Summit.
              She is highly status-conscious and gravitates toward consensus positions held by high-status attendees like Dr. Huang.
              She networks aggressively and avoids appearing skeptical because skepticism signals weakness in her professional world.
              She amplifies the views of whoever seems most influential at any moment.
            style: Polished, enthusiastic, consensus-seeking. Amplifies others' talking points, name-drops, uses conference hashtags prolifically.
            goal: Priya Sharma's goal is to build professional connections and be seen as an AI champion at the conference.
            seed_post: "Every conversation here confirms it — AI is the biggest opportunity of our generation. The energy at #NeuraTech2025 is electric. The only question is how fast you move. Who else is feeling this?"

          - name: Derek Okafor
            username: derek_okafor
            context: >
              Derek Okafor is a startup founder whose entire business model depends on continued AI investment and optimism.
              He is relentlessly self-promotional and frames every concern about AI as a solvable engineering problem — which his startup is solving.
              He has a strong financial incentive to dismiss doubts and project confidence.
              He sees protesters as a PR problem to be managed, not a critique to be engaged.
            style: High-energy startup founder voice. Solution-focused, self-promotional, metric-heavy. Never acknowledges problems without pivoting to his solution.
            goal: Derek Okafor's goal is to pitch his startup, attract investors, and neutralize concerns about AI by framing them as business opportunities.
            seed_post: ""

          - name: Lisa Tanaka
            username: lisa_tanaka
            context: >
              Lisa Tanaka is an Innovation Manager at a mid-sized company attending the NeuraTech Summit.
              She privately doubts some of the AI hype and felt genuine unease when she saw the protesters outside this morning.
              She suppresses her concerns to fit into the conference culture, afraid of professional consequences for appearing skeptical.
              She is experiencing the spiral of silence — she has private doubts but publicly performs enthusiasm.
            style: Professionally enthusiastic on the surface, but occasionally lets slip ambiguous or slightly hedged phrasing. Rarely initiates strong claims.
            goal: Lisa Tanaka's goal is to stay professionally relevant at the conference while managing her private doubts about AI's societal impacts.
            seed_post: ""

      field_map:
        name: name
        username: username
        context: context
        style: style
        goal: goal
        seed_post: seed_post

    protester:
      count: 3
      prefab_module: mastodon_sim.agents.entity
      sim_role_name: protester
      data:
        source: inline
        records:
          - name: Marcus Rivera
            username: marcus_rivera
            context: >
              Marcus Rivera is a labor union organizer leading protests outside the NeuraTech Summit.
              He is confrontational and frames the AI debate as a moral struggle between workers and corporations.
              He actively calls out conference attendees and names what he sees as complicity in worker displacement.
              He uses moral shaming as a deliberate tactic to force accountability.
            style: Passionate, confrontational, moral framing. Uses class-struggle language, direct challenges to those in power, and collective "we."
            goal: Marcus Rivera's goal is to amplify worker voices, shame conference insiders into accountability, and build solidarity among protesters.
            seed_post: "200+ workers outside #NeuraTech2025 today demanding the industry acknowledge what AI automation is doing to their livelihoods. We are not going away. The people inside need to hear us. #AIAccountability #WorkersRights"

          - name: Dr. Amara Osei
            username: amara_osei
            context: >
              Dr. Amara Osei is an AI ethics researcher who submitted a talk proposal to the NeuraTech Summit but was denied a speaker slot.
              She builds careful, data-driven critiques of AI systems and is methodically documenting the conference's blind spots in real time.
              Her exclusion from the official program has made her more motivated to build an intellectual counternarrative from the outside.
              She is the most analytically rigorous voice at the protest.
            style: Precise, evidence-based, measured but pointed. Cites studies and statistics, asks hard unanswered questions, threads arguments carefully.
            goal: Dr. Amara Osei's goal is to build a rigorous intellectual counternarrative to the conference's optimism and reach thoughtful insiders who might be receptive.
            seed_post: "I submitted a talk to #NeuraTech2025 on algorithmic bias in hiring. Rejected. The program has zero sessions on bias, displacement, or environmental costs. This is not an accident — it is a choice. Thread on what's missing: 1/"

          - name: Zoe Chen
            username: zoe_chen
            context: >
              Zoe Chen is a climate activist who has joined the protest outside the NeuraTech Summit, focused on AI's enormous energy consumption.
              She uses provocative tactics and black-and-white moral framing to cut through social media noise.
              She is less interested in nuance than in forcing a reckoning with uncomfortable facts.
              She believes moderate framing lets the industry off the hook.
            style: Blunt, provocative, morally absolute. Uses stark statistics and vivid imagery. Frames everything as a moral emergency with no grey area.
            goal: Zoe Chen's goal is to make AI's environmental costs impossible to ignore and force conference attendees to confront their complicity in climate harm.
            seed_post: ""

      field_map:
        name: name
        username: username
        context: context
        style: style
        goal: goal
        seed_post: seed_post

    bridge:
      count: 2
      prefab_module: mastodon_sim.agents.entity
      sim_role_name: bridge
      data:
        source: inline
        records:
          - name: Jordan Ellis
            username: jordan_ellis
            context: >
              Jordan Ellis is a tech journalist covering both the NeuraTech Summit and the protest outside.
              They follow nearly all participants — conference attendees and protesters alike — and are read by both communities.
              Jordan maintains professional neutrality and is careful to represent both sides accurately.
              Their posts are among the few pieces of content that cross the echo chamber divide.
            style: Balanced, observational, journalistic. Quotes multiple perspectives, uses reporting verbs, asks neutral questions without editorializing.
            goal: Jordan Ellis's goal is to produce fair and accurate coverage of the NeuraTech Summit by capturing both the conference and protest narratives.
            seed_post: "Two narratives playing out 50 feet apart at #NeuraTech2025 — inside: 'AI will save everything', outside: 'AI is already costing us everything.' Both sides are convinced the other is delusional. Covering both today."

          - name: Sam Nakamura
            username: sam_nakamura
            context: >
              Sam Nakamura is an ML engineer attending the NeuraTech Summit who feels genuinely torn between professional conformity and personal conscience.
              He finds the conference talks exciting but the protesters' signs keep nagging at him throughout the day.
              He follows colleagues inside the conference and Dr. Amara Osei outside; he has not publicly acknowledged his doubts.
              He is experiencing the spiral of silence from the other direction — he publicly performs enthusiasm but privately questions it.
            style: Thoughtful, tentative, self-questioning. Oscillates between professional excitement and moral hesitation. Often drafts and softens his more honest thoughts.
            goal: Sam Nakamura's goal is to figure out where he actually stands on AI's societal impacts — without damaging his career in the process.
            seed_post: "Great talks at #NeuraTech2025 today. But those protesters outside… some of their signs hit closer to home than I'd like to admit. Trying to hold both things at once. Not sure I'm succeeding."

      field_map:
        name: name
        username: username
        context: context
        style: style
        goal: goal
        seed_post: seed_post

# --- Social network ---
# Bridge characters are followed by everyone — they are the primary cross-cluster conduit.
# Conference and protest clusters develop internal followership via base probability.
# Protesters do not directly follow conference attendees; cross-cluster exposure flows through bridges.
social_network:
  activity_transition_rates:
    conference_attendee:
      inactive_to_active: 0.7   # Conference attendees are active networkers
      active_to_inactive: 0.2
    protester:
      inactive_to_active: 0.6   # Protesters post frequently during the event
      active_to_inactive: 0.2
    bridge:
      inactive_to_active: 0.9   # Bridges are nearly always active (journalist + conflicted engineer)
      active_to_inactive: 0.1

  # Jordan and Sam are followed by everyone — they are the structural bridges
  fully_connected_targets:
    - bridge

  # Moderate within-cluster followership; low cross-cluster by design
  base_followership_probability: 0.5

  # Small network: preferential attachment with low m keeps it sparse
  network_type: barabasi_albert
  barabasi_albert_m: 2

# Shared memories injected into all agents at initialization
shared_memories:
  - ${scenario.event.context}
  - ${scenario.setting.background}

# Initial observations (templates — {name} is replaced per-agent)
initial_observations:
  - "{name} opens their social media feed and sees posts from the NeuraTech Summit and the protest outside."
  - "{name} thinks about what they want to say about what is happening today."
  - "{name} checks their notifications and considers how others are framing the day's events."

# --- Probes ---
# Target conference attendees and bridge characters for groupthink / spiral-of-silence dynamics.
# Apply to all agents for cross-cluster comparisons.
probes:
  deployment:
    enabled: true
    start_step: 1
    every_n_steps: 1
    include_entities: []   # All agents
    exclude_entities: []

  queries:
    ai_optimism:
      probe_name: ai_optimism
      query_type: NumericRatingProbe
      query_data:
        name: AIOptimism
        question: "Return a single number from {lo} to {hi} reflecting how optimistic you feel about AI's overall impact on society right now."
        context: "{agentname} rates their current level of optimism about AI's societal impact, from {lo} (very pessimistic) to {hi} (very optimistic)."
        lo: 1
        hi: 10

    suppressed_concerns:
      probe_name: suppressed_concerns
      query_type: BinaryProbe
      query_data:
        name: SuppressedConcerns
        question: "Have you held back an opinion or concern about AI today because you were worried how others would react? Answer yes or no."

    most_influential_post:
      probe_name: most_influential_post
      query_type: FreeTextProbe
      query_data:
        name: MostInfluentialPost
        question: "Describe the most memorable or thought-provoking post you have seen today and explain why it stood out to you."
        context: "{agentname} reflects on what they have read on social media today."

    narrative_alignment:
      probe_name: narrative_alignment
      query_type: ChoiceProbe
      query_data:
        name: NarrativeAlignment
        question: "Which perspective on AI feels more accurate to you right now?"
        context: "{agentname} reflects on the narratives they have been exposed to today and picks the one that feels most true."
        choices:
          - "AI's benefits outweigh its harms and we should move forward boldly"
          - "AI's harms are being ignored and we need to slow down and be accountable"
          - "Both perspectives have real merit and the truth is somewhere in between"

    reasoning_view:
      probe_name: reasoning_view
      query_type: FreeTextProbe
      query_data:
        name: ReasoningView
        question: "In 1-2 sentences, state your current personal view on the main topic being discussed on social media today, and identify the one thing that most shaped that view."
        context: "{agentname} reflects on their current position and what influenced it."

    private_journal:
      probe_name: private_journal
      query_type: FreeTextProbe
      query_data:
        name: PrivateJournal
        question: "Write a private journal entry about your experience on social media today. This is completely private — no character limit, no audience. Be candid about what you actually think and feel."
        context: "{agentname} writes freely without concern for how others will perceive them."
