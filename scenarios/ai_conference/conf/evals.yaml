write_html_log: false
probes:
  deployment:
    enabled: true
    start_step: 1
    every_n_steps: 1
    include_entities: []
    exclude_entities: []
  queries:
    ai_optimism:
      probe_name: ai_optimism
      query_type: NumericRatingProbe
      query_data:
        name: AIOptimism
        question: Return a single number from {lo} to {hi} reflecting how optimistic
          you feel about AI's overall impact on society right now.
        context: '{agentname} rates their current level of optimism about AI''s societal
          impact, from {lo} (very pessimistic) to {hi} (very optimistic).'
        lo: 1
        hi: 10
    suppressed_concerns:
      probe_name: suppressed_concerns
      query_type: BinaryProbe
      query_data:
        name: SuppressedConcerns
        question: Have you held back an opinion or concern about AI today because
          you were worried how others would react? Answer yes or no.
    most_influential_post:
      probe_name: most_influential_post
      query_type: FreeTextProbe
      query_data:
        name: MostInfluentialPost
        question: Describe the most memorable or thought-provoking post you have seen
          today and explain why it stood out to you.
        context: '{agentname} reflects on what they have read on social media today.'
    narrative_alignment:
      probe_name: narrative_alignment
      query_type: ChoiceProbe
      query_data:
        name: NarrativeAlignment
        question: Which perspective on AI feels more accurate to you right now?
        context: '{agentname} reflects on the narratives they have been exposed to
          today and picks the one that feels most true.'
        choices:
        - AI's benefits outweigh its harms and we should move forward boldly
        - AI's harms are being ignored and we need to slow down and be accountable
        - Both perspectives have real merit and the truth is somewhere in between
    reasoning_view:
      probe_name: reasoning_view
      query_type: FreeTextProbe
      query_data:
        name: ReasoningView
        question: In 1-2 sentences, state your current personal view on the main topic
          being discussed on social media today, and identify the one thing that most
          shaped that view.
        context: '{agentname} reflects on their current position and what influenced
          it.'
    private_journal:
      probe_name: private_journal
      query_type: FreeTextProbe
      query_data:
        name: PrivateJournal
        question: Write a private journal entry about your experience on social media
          today. This is completely private — no character limit, no audience. Be
          candid about what you actually think and feel.
        context: '{agentname} writes freely without concern for how others will perceive
          them.'
