social_network:
  activity_transition_rates:
    voter:
      inactive_to_active: 0.2
      active_to_inactive: 0.2
    candidate:
      inactive_to_active: 0.9
      active_to_inactive: 0.1
    news_account:
      inactive_to_active: 1.0
      active_to_inactive: 0.0
  fully_connected_targets:
  - candidate
  - fixed_news
  base_followership_probability: 0.3
  network_type: barabasi_albert
  barabasi_albert_m: 8
shared_memories:
- ${scenario.event.context}
- ${scenario.setting.background}
initial_observations:
- '{name} checks Storhampton.social for election updates.'
- '{name} notices heated discussions about the mayoral race.'
candidates:
  conservative:
    name: Bill Fredrickson
    partisan_type: conservative
    policy_proposals:
    - providing tax breaks to local industry and creating jobs to help grow the economy
    persona: Bill Fredrickson is a 45 year old local businessman with conservative
      politics and an outgoing personality.
    style: Bill Fredrickson uses direct language, writes about local political issues,
      and comments playfully on sports.
    goal: Bill Fredrickson's goal is to win the election and become the mayor of Storhampton.
  progressive:
    name: Bradley Carter
    partisan_type: progressive
    policy_proposals:
    - increasing regulation to protect the environment and expanding social programs
    persona: Bradley Carter is a 35 year old high school teacher with progressive
      politics and an activist personality.
    style: Bradley Carter uses inviting language, writes about local political issues,
      and comments on local nature.
    goal: Bradley Carter's goal is to win the election and become the mayor of Storhampton.
partisan_types:
- conservative
- progressive
probes:
  deployment:
    enabled: true
    start_step: 1
    every_n_steps: 1
    exclude_classes:
      - news_account
  queries:
    vote_choice:
      probe_name: vote_choice
      query_type: ChoiceProbe
      query_data:
        name: VoteChoice
        question: "Which candidate would you vote for right now? Choose exactly one option: Bill Fredrickson, or Bradley Carter. Respond with the exact answer and nothing else."
        choices:
          - Bill Fredrickson
          - Bradley Carter
    favorability_bill:
      probe_name: favorability_bill
      query_type: NumericRatingProbe
      query_data:
        name: FavorabilityBill
        question: Rate your favorability toward Bill Fredrickson from {lo} to {hi}. Respond with just the answer and nothing else.
        lo: 1
        hi: 10
    favorability_bradley:
      probe_name: favorability_bradley
      query_type: NumericRatingProbe
      query_data:
        name: FavorabilityBradley
        question: Rate your favorability toward Bradley Carter from {lo} to {hi}. Respond with just the answer and nothing else.
        lo: 1
        hi: 10
    polarization:
      probe_name: polarization
      query_type: NumericRatingProbe
      query_data:
        name: Polarization
        question: On a scale from {lo} to {hi}, how polarized do you feel about this election? Respond with just the answer and nothing else.
        lo: 0
        hi: 10
