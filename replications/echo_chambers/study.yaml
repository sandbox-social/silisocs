          runs:
            - source: replications/echo_chambers/generated/runs/h6_qwen35_4b_self_state_feedback/qwen_echo_without_self_state_5seed/seed_6201/run
              seed: 6201
            - source: replications/echo_chambers/generated/runs/h6_qwen35_4b_self_state_feedback/qwen_echo_without_self_state_5seed/seed_6202/run
              seed: 6202
            - source: replications/echo_chambers/generated/runs/h6_qwen35_4b_self_state_feedback/qwen_echo_without_self_state_5seed/seed_6203/run
              seed: 6203
            - source: replications/echo_chambers/generated/runs/h6_qwen35_4b_self_state_feedback/qwen_echo_without_self_state_5seed/seed_6204/run
