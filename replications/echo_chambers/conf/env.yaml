gm:
  backend:
    type: twitter_like
    class_path: replications.echo_chambers.components.app.EchoChamberApp
    params:
      agent_records_path: ${echo_agent_records_path}
      belief_keywords_path: ${echo_belief_keywords_path}
      opinions_path: ${echo_opinions_path}
      topic_key: ${echo_topic_key}
      network_path: ${echo_network_path}
      recommendation: ${echo_recommendation}
      max_interactions: ${echo_max_interactions}
      similarity_threshold: ${echo_similarity_threshold}
      mitigation_step: ${echo_mitigation_step}
      mitigation_perspectives_path: ${echo_mitigation_perspectives_path}
      mitigation_perspectives_only: ${echo_mitigation_perspectives_only}
      with_long_memory: ${echo_with_long_memory}
      leaders: ${echo_leaders}
      llm_response_mode: ${echo_llm_response_mode}
      prompt_variant: ${echo_prompt_variant}
      seed: ${seed}
      perform_operations: false
      app_description: You are participating in a fixed-network opinion simulation.
    # Agents in the exact reproduction never call a backend action: they emit a
    # belief JSON that EchoChamberResolve applies directly. `do_nothing` is the
    # one callable action kept so the catalog is not an empty allow-list (which
    # the GM rejects); tool-calling is off and the action prompt is a fixed
    # template, so nothing about it reaches the model.
    enabled_actions:
    - FINISHED
    - do_nothing
  components:
    initialize:
      built_in: null
      class_path: replications.echo_chambers.components.initialize.EchoChamberInitializer
      params:
        graph:
          fully_connected_targets: []
          base_followership_probability: 0.0
          network_type: predefined
          predefined_graph: {}
          predefined_graph_path: ${env.gm.backend.params.network_path}
    # Activity gating lives on the sim layer since 0.4.0; the equivalent
    # `activity_probability` rates are in conf/sim.yaml under
    # sim.engine.participation (see docs/upgrading.md).
    next_acting:
      built_in: all_agents
      class_path: null
      params: {}
    update:
      built_in: null
      class_path: replications.echo_chambers.components.recommend.NoOpRecommendationUpdate
      params: null
    observe:
      built_in: null
      class_path: replications.echo_chambers.components.observe.EchoChamberObservation
      params: {}
    resolve:
      built_in: null
      class_path: replications.echo_chambers.components.resolve.EchoChamberResolve
      params: {}
    action_prompt:
      built_in: default
      class_path: null
      params:
        action_prompt: 'You are participating in a fixed-network opinion simulation.


          Update your belief using the echo chamber replication prompt.'
        output_style: ''
  class_path: silisocs.environments.gm.game_master.ComponentGameMaster
