platform_type: twitter_like
use_server: false
enabled_actions: [FINISHED]
timeline_posts: 0
observation_history: 1

app:
  class_path: replications.echo_chambers.components.app.EchoChamberApp
  params:
    agent_records_path: ${echo_agent_records_path}
    belief_keywords_path: ${echo_belief_keywords_path}
    opinions_path: ${echo_opinions_path}
    topic_key: ${echo_topic_key}
    network_path: ${echo_network_path}
    recommendation: ${echo_recommendation}
    max_interactions: ${echo_max_interactions}
    similarity_threshold: ${echo_similarity_threshold}
    mitigation_step: ${echo_mitigation_step}
    mitigation_perspectives_path: ${echo_mitigation_perspectives_path}
    mitigation_perspectives_only: ${echo_mitigation_perspectives_only}
    with_long_memory: ${echo_with_long_memory}
    leaders: ${echo_leaders}
    llm_response_mode: ${echo_llm_response_mode}
    prompt_variant: ${echo_prompt_variant}
    seed: ${seed}

social_network:
  activity_transition_rates:
    echo_user:
      inactive_to_active: 1.0
      active_to_inactive: 0.0
  fully_connected_targets: []
  base_followership_probability: 0.0
  network_type: predefined
  predefined_graph: {}
  predefined_graph_path: ${env.app.params.network_path}

gm:
  preset: base
  components:
    initialize:
      built_in: null
      class_path: replications.echo_chambers.components.initialize.EchoChamberInitializer
      params: {}
    next_acting:
      built_in: all_agents
      class_path: null
      params: {}
    update:
      built_in: null
      class_path: replications.echo_chambers.components.update.NoOpUpdate
      params: {}
    observe:
      built_in: null
      class_path: replications.echo_chambers.components.observe.EchoChamberObservation
      params: {}
    resolve:
      built_in: null
      class_path: replications.echo_chambers.components.resolve.EchoChamberResolve
      params: {}

usage_instructions: |
  You are participating in a fixed-network opinion simulation.

action_prompt: |
  Update your belief using the echo chamber replication prompt.

output_style: ""
