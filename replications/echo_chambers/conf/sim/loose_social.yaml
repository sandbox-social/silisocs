llm:
  provider: openai
  name: gpt-4o-mini-2024-07-18
  temperature: 1.0
  disabled: false
  extra_kwargs: {}

max_concurrent_actions: 100
action_mode: generic
tool_calling:
  mode: single
prompt_additions:
  action_count_guidance: false

initialization:
  agents:
    built_in: default
    class_path: null
    params: {}
  game_masters:
    built_in: default
    class_path: null
    params: {}
  simulation:
    built_in: none
    class_path: null
    params: {}

checkpoint:
  every_n_steps: null
  explicit_steps: [30]

engine:
  step:
    built_in: base
    class_path: null
    params:
      flow_order: [fixed_pre, default]
      agent_to_flow: {}
  turn_policy:
    built_in: null
    class_path: replications.echo_chambers.components.turn_policy.FixedActionsThenBeliefProbePolicy
    params:
      count: 5
      belief_options: ["-2", "-1", "0", "1", "2"]
      belief_probe_tag: echo_belief_probe
      include_self_state: ${echo_include_self_state_feedback}

roleplaying_instructions: |
  You are simulating {name}, a person participating in a social-media opinion discussion.
