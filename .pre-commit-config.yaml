# https://pre-commit.com
default_install_hook_types: [commit-msg, pre-commit]
default_stages: [pre-commit, manual]
fail_fast: true
repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-use-type-annotations
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
      - id: text-unicode-replacement-char
        # Vendored third-party minified bundles legitimately contain a U+FFFD;
        # they are not our source to lint (and with fail_fast this hook would
        # otherwise short-circuit the whole gate before ruff/mypy run).
        exclude: ^src/silisocs/studio/static/.*\.min\.js$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        # The bundled demo videos are intentionally committed binaries
        # (see demo/README.md for the pipeline that regenerates them).
        exclude: ^docs/assets/videos/.*\.mp4$
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
        args: [--unsafe]
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        types: [python]
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: name-tests-test
        args: [--pytest-test-first]
      - id: trailing-whitespace
        types: [python]
  - repo: local
    hooks:
      - id: commitizen
        name: commitizen
        entry: cz check
        args: [--commit-msg-file]
        require_serial: true
        language: system
        stages: [commit-msg]
      - id: ruff-check
        name: ruff check
        entry: ruff check
        args: ["--force-exclude", "--extend-fixable=F401,F841", "--fix-only"]
        require_serial: true
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        args: [--force-exclude]
        require_serial: true
        language: system
        types_or: [python, pyi]
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        args: [src/silisocs, tests]
      - id: lint-imports
        name: lint-imports
        # Layering contracts live in pyproject.toml ([tool.importlinter]): the
        # runtime kernel imports no upper layer, and the big layers stay
        # unidirectional. Whole-graph check, so it takes no filenames.
        entry: lint-imports
        language: system
        pass_filenames: false
        files: ^(src/silisocs/.*\.py|pyproject\.toml)$
