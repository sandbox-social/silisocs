# https://pre-commit.com
default_install_hook_types: [commit-msg, pre-commit]
default_stages: [pre-commit, manual]
fail_fast: true
repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-use-type-annotations
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
      - id: text-unicode-replacement-char
        # Vendored third-party minified bundles legitimately contain a U+FFFD;
        # they are not our source to lint (and with fail_fast this hook would
        # otherwise short-circuit the whole gate before ruff/mypy run).
        exclude: ^src/silisocs/studio/static/.*\.min\.js$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        # The bundled demo videos are intentionally committed binaries
        # (see demo/README.md for the pipeline that regenerates them).
        exclude: ^docs/assets/videos/.*\.mp4$
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
        args: [--unsafe]
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        types: [python]
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: name-tests-test
        args: [--pytest-test-first]
      - id: trailing-whitespace
        types: [python]
  - repo: local
    hooks:
      - id: commitizen
        name: commitizen
        entry: cz check
        args: [--commit-msg-file]
        require_serial: true
        language: system
        stages: [commit-msg]
      - id: ruff-check
        name: ruff check
        entry: ruff check
        # No `--extend-fixable`: pyproject marks F401/F841 `unfixable` on purpose,
        # because auto-deleting an "unused" import silently removes a side-effect
        # registration import (`import x  # registers a provider`) at commit time,
        # before the blocking hook below ever sees it. F401 is not in that hook's
        # frozen ignore list, so an unused import now fails the gate instead.
        args: ["--force-exclude", "--fix-only"]
        require_serial: true
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        args: [--force-exclude]
        require_serial: true
        language: system
        types_or: [python, pyi]
      - id: ruff-check-blocking
        name: ruff check (blocking)
        # The hook above runs `--fix-only`, which applies what it can and always
        # exits 0 — it is the formatter, not the gate. This one is the gate.
        # `--extend-ignore` freezes exactly the rules that have un-drained
        # findings today (counts in the comment below), so the gate is green now
        # while every other selected rule fails the commit. Drain a rule, then
        # delete its code from this list; never add a code without draining
        # something else.
        #
        # Frozen (2719 findings, 47 rules): D103 997, PLR2004 416, D102 381,
        # PLC0415 315, PLR0913 84, D205 69, PT018 52, D401 41, C901 37, D100 35,
        # PERF401 25, D105 23, RUF012 22, PT017 22, PT011 21, PLR0912 21,
        # RUF043 20, D101 19, PLR0915 15, PLR0911 13, PLW2901 10, E402 9,
        # PLW0127 8, PT006 7, SIM105 6, PLW1510 5, N806 5, SIM102 4, F841 4,
        # D104 4, D400 3, RUF059 2, RUF001 2, PLW0603 2, PLW0108 2, D301 2,
        # ASYNC109 2, and 10 rules with 1 each (UP042, RUF022, RUF007, RUF005,
        # RUF003, PT012, NPY002, B027, B017, B007).
        # B905, C401, C416, PERF102, RUF046, SIM118 were drained (their fixes
        # are auto-applied by the --fix-only hook above; only their unsafe-fix
        # residue was frozen debt, and that residue is fixed) — do not re-add.
        #
        # RUF100 is the 48th and is an artifact of the freeze rather than debt:
        # there were 0 unused-`noqa` findings before, but ignoring a rule makes
        # its in-repo `# noqa` directives "unused". It comes back for free
        # as the list above drains.
        entry: ruff check
        args:
          - --force-exclude
          - --no-fix
          - --extend-ignore=ASYNC109,B007,B017,B027,C901,D100,D101,D102,D103,D104,D105,D205,D301,D400,D401,E402,F841,N806,NPY002,PERF401,PLC0415,PLR0911,PLR0912,PLR0913,PLR0915,PLR2004,PLW0108,PLW0127,PLW0603,PLW1510,PLW2901,PT006,PT011,PT012,PT017,PT018,RUF001,RUF003,RUF005,RUF007,RUF012,RUF022,RUF043,RUF059,RUF100,SIM102,SIM105,UP042
        require_serial: true
        language: system
        types_or: [python, pyi]
        # `scenarios/` is example content shipped as data, not engine source, and
        # still carries unported legacy Concordia snippets whose names do not
        # resolve (F821). Gating them would mean freezing F821 repo-wide, which
        # is a far worse trade than leaving the examples out of the gate.
        exclude: ^scenarios/
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        args: [src/silisocs, tests]
      - id: lint-imports
        name: lint-imports
        # Layering contracts live in pyproject.toml ([tool.importlinter]): the
        # runtime kernel imports no upper layer, the core packages stay
        # unidirectional top-down, and the runtime does not depend on scenario
        # authoring. Whole-graph check, so it takes no filenames.
        entry: lint-imports
        language: system
        pass_filenames: false
        files: ^(src/silisocs/.*\.py|pyproject\.toml)$
