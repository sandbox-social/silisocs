<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microblog | Silisocs Studio</title>
    <script src="assets/viewer.js"></script>
    <link rel="stylesheet" href="assets/design.css">
    <style>
        .post-card { border-bottom: 1px solid var(--border); padding: 12px 16px; cursor: pointer; transition: background 0.15s; }
        .post-card:hover, .post-card.highlight { background: var(--surface-2); }
        .post-card.highlight { border-left: 2px solid var(--accent); }
        .stat-btn { display: flex; align-items: center; gap: 5px; min-width: 48px; font-size: 13px; color: var(--muted); transition: color var(--motion-fast); cursor: pointer; padding: 5px 8px; border-radius: var(--radius-pill); }
        .stat-btn:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
        .reply-btn:hover { color: var(--accent-link); } .repost-btn:hover { color: var(--success); } .like-btn:hover { color: var(--danger); }
        .back-btn { display:grid; width:36px; height:36px; padding:8px; place-items:center; border:0; border-radius: var(--radius-pill); background:transparent; cursor: pointer; } .back-btn:hover { background: var(--surface-2); }
        .tab { padding: 16px 0; text-align: center; font-weight: 700; font-size: 15px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); transition: all 0.2s; flex: 1; }
        .tab:hover { background: var(--surface-2); } .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
        .badge { background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: var(--radius-pill); margin-left: 4px; }
        .post-context { display:flex; align-items:center; gap:5px; }
        .post-context .viewer-icon { width:14px; height:14px; }
        #view-stack > div { display: none; } #view-stack > div.active { display: block; }
    </style>
</head>
<body class="microblog">
<div class="viewer-mobile-brand"><span class="viewer-brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><b>Silisocs</b><small>Microblog world</small></span></div>
<div class="viewer-layout flex max-w-[1280px] mx-auto min-h-screen">

    <!-- Left sidebar -->
    <nav class="w-[275px] flex-shrink-0 hidden lg:flex flex-col justify-between border-r border-border p-3 sticky top-0 h-screen">
        <div>
            <div class="viewer-brand" onclick="showView('home');loadGlobalFeed(true)"><span class="viewer-brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><b>Silisocs</b><small>Microblog world</small></span></div>
            <div class="nav-item active" onclick="activateNav(this);showView('home');loadGlobalFeed(true)"><span data-viewer-icon="home"></span><span class="font-bold">Home</span></div>
            <div class="nav-item" onclick="activateNav(this);showView('explore')"><span data-viewer-icon="explore"></span><span>Explore</span></div>
            <div class="nav-item" onclick="activateNav(this);loadAllUsers()"><span data-viewer-icon="users"></span><span>Users</span></div>
            <div class="nav-item" onclick="activateNav(this);loadAdmin()"><span data-viewer-icon="admin"></span><span>Admin</span></div>
        </div>
        <div class="p-3 border-t border-border">
            <input id="searchInput" type="text" placeholder="Search users..."
                   class="w-full bg-surface border border-border rounded-full px-4 py-2 text-sm focus:outline-none focus:border-brand"
                   onkeydown="if(event.key==='Enter')searchUsers(this.value)">
        </div>
    </nav>

    <!-- Main column -->
    <main class="flex-1 min-w-0 border-r border-border max-w-[600px] overflow-y-auto h-screen">
        <div id="view-stack">

            <!-- HOME / GLOBAL FEED VIEW -->
            <div id="view-home" class="active">
                <header class="sticky top-0 z-20 backdrop-blur-md bg-black/70 border-b border-border">
                    <div class="flex">
                        <div class="tab active" id="tab-global">Global Timeline</div>
                    </div>
                </header>
                <div id="feed-content"></div>
                <div id="feed-loading" class="p-6 text-center text-dim">Loading...</div>
            </div>

            <!-- PROFILE VIEW -->
            <div id="view-profile">
                <header class="sticky top-0 z-20 backdrop-blur-md bg-black/70 border-b border-border px-4 py-2 flex items-center gap-3">
                    <button type="button" class="back-btn" onclick="goBack()" aria-label="Go back"><span data-viewer-icon="arrowLeft"></span></button>
                    <div>
                        <div class="font-bold text-lg" id="profile-displayname"></div>
                        <div class="text-dim text-xs" id="profile-postcount"></div>
                    </div>
                </header>
                <div class="px-4 pt-12 pb-4 border-b border-border">
                    <div class="flex items-end gap-4 -mt-8">
                        <div class="avatar text-3xl" id="profile-avatar" style="width:80px;height:80px;font-size:32px;border:3px solid var(--surface);"></div>
                    </div>
                    <div class="mt-3">
                        <div class="font-bold text-xl" id="profile-name2"></div>
                        <div class="text-dim" id="profile-username2"></div>
                    </div>
                    <div class="mt-2 text-sm" id="profile-bio"></div>
                    <div class="flex gap-4 mt-3 text-sm">
                        <span class="cursor-pointer hover:underline" onclick="switchProfileTab('following')"><strong id="profile-following">0</strong> <span class="text-dim">Following</span></span>
                        <span class="cursor-pointer hover:underline" onclick="switchProfileTab('followers')"><strong id="profile-followers">0</strong> <span class="text-dim">Followers</span></span>
                    </div>
                </div>
                <div class="flex border-b border-border">
                    <div class="tab active" id="ptab-posts" onclick="switchProfileTab('posts')">Posts</div>
                    <div class="tab" id="ptab-followers" onclick="switchProfileTab('followers')">Followers</div>
                    <div class="tab" id="ptab-following" onclick="switchProfileTab('following')">Following</div>
                </div>
                <div id="profile-tab-content"></div>
            </div>

            <!-- POST DETAIL / THREAD VIEW -->
            <div id="view-thread">
                <header class="sticky top-0 z-20 backdrop-blur-md bg-black/70 border-b border-border px-4 py-3 flex items-center gap-3">
                    <button type="button" class="back-btn" onclick="goBack()" aria-label="Go back"><span data-viewer-icon="arrowLeft"></span></button>
                    <span class="font-bold text-lg">Post</span>
                </header>
                <div id="thread-content"></div>
            </div>

            <!-- EXPLORE VIEW -->
            <div id="view-explore">
                <header class="sticky top-0 z-20 backdrop-blur-md bg-black/70 border-b border-border px-4 py-3">
                    <input type="text" placeholder="Search users..."
                           class="w-full bg-surface border border-border rounded-full px-4 py-2 text-sm focus:outline-none focus:border-brand"
                           onkeydown="if(event.key==='Enter')searchUsers(this.value)">
                </header>
                <div id="explore-content" class="p-4"></div>
            </div>

            <!-- USERS LIST VIEW -->
            <div id="view-users">
                <header class="sticky top-0 z-20 backdrop-blur-md bg-black/70 border-b border-border px-4 py-3">
                    <span class="font-bold text-lg">All Users</span>
                </header>
                <div id="users-content"></div>
            </div>

            <!-- ADMIN VIEW -->
            <div id="view-admin">
                <header class="sticky top-0 z-20 backdrop-blur-md bg-black/70 border-b border-border px-4 py-3">
                    <span class="font-bold text-lg">Admin Overview</span>
                </header>
                <div id="admin-content" class="p-4"></div>
            </div>
        </div>
    </main>

    <!-- Right sidebar -->
    <aside class="w-[350px] flex-shrink-0 hidden xl:block p-4 sticky top-0 h-screen overflow-y-auto">
        <div class="bg-surface rounded-2xl p-4 mb-4">
            <h3 class="font-bold text-xl mb-3">Platform Stats</h3>
            <div id="sidebar-stats" class="text-sm text-dim">Loading...</div>
        </div>
        <div class="bg-surface rounded-2xl p-4">
            <h3 class="font-bold text-xl mb-3">Top Users</h3>
            <div id="sidebar-top-users" class="space-y-3"></div>
        </div>
    </aside>
</div>

<nav class="viewer-mobile-dock" aria-label="Viewer navigation">
    <button type="button" onclick="showView('home');loadGlobalFeed(true)"><span data-viewer-icon="home"></span><span>Home</span></button>
    <button type="button" onclick="showView('explore')"><span data-viewer-icon="explore"></span><span>Explore</span></button>
    <button type="button" onclick="loadAllUsers()"><span data-viewer-icon="users"></span><span>Users</span></button>
    <button type="button" onclick="loadAdmin()"><span data-viewer-icon="admin"></span><span>Admin</span></button>
</nav>

<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let feedCursor = null;
let feedLoading = false;
const viewHistory = [];
// esc, escAttr, getColor, timeSince and wireActions come from assets/viewer.js.

// ---------------------------------------------------------------------------
// View management
// ---------------------------------------------------------------------------
function showView(id, pushHistory=true) {
    if(pushHistory) { const prev=document.querySelector('#view-stack > div.active'); if(prev) viewHistory.push(prev.id); }
    document.querySelectorAll('#view-stack > div').forEach(v => v.classList.remove('active'));
    const el = document.getElementById('view-'+id);
    if(el) el.classList.add('active');
}
function goBack() {
    const prev = viewHistory.pop();
    if(prev) { document.querySelectorAll('#view-stack > div').forEach(v=>v.classList.remove('active')); document.getElementById(prev).classList.add('active'); }
    else { showView('home',false); loadGlobalFeed(true); }
}
function activateNav(el) {
    document.querySelectorAll('.viewer-layout > nav .nav-item').forEach(n=>n.classList.remove('active'));
    el.classList.add('active');
}

// ---------------------------------------------------------------------------
// Post card renderer
// ---------------------------------------------------------------------------
function renderPostCard(post, opts={}) {
    const isRepost = post.type==='repost';
    const isQuote = post.type==='quote';
    const highlight = opts.highlight ? 'highlight' : '';
    return `
    <div class="post-card ${highlight}" data-action="thread" data-id="${post.id}">
        ${isRepost ? `<div class="post-context text-dim text-xs ml-12 mb-1">${viewerIcon('repost')} Reposted</div>` : ''}
        <div class="flex gap-3">
            <div class="avatar" style="background:${getColor(post.username)}" data-action="profile" data-username="${escAttr(post.username)}">${esc(post.username[0].toUpperCase())}</div>
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1 flex-wrap">
                    <span class="font-bold text-[15px] hover:underline cursor-pointer" data-action="profile" data-username="${escAttr(post.username)}">${esc(post.username)}</span>
                    <span class="text-dim text-[13px]">@${esc(post.username)}</span>
                    <span class="text-dim text-[13px]">&middot; ${timeSince(post.created_at)}</span>
                    ${post.reply_to_id ? `<span class="post-context text-dim text-[12px]">${viewerIcon('reply')} reply</span>` : ''}
                </div>
                <div class="mt-1 text-[15px] leading-snug whitespace-pre-wrap break-words">${esc(post.content)}</div>
                ${isQuote && post.quote_of_id ? `<div class="post-context mt-2 border border-border rounded-xl p-3 text-sm text-dim cursor-pointer" data-action="thread" data-id="${post.quote_of_id}">${viewerIcon('comment')} Quoted post #${post.quote_of_id}</div>` : ''}
                <div class="flex gap-6 mt-3 -ml-2">
                    <div class="stat-btn reply-btn" data-action="thread" data-id="${post.id}">
                        ${viewerIcon('comment')}
                        <span>${post.reply_count||0}</span>
                    </div>
                    <div class="stat-btn repost-btn">
                        ${viewerIcon('repost')}
                        <span>${post.reposts_count||0}</span>
                    </div>
                    <div class="stat-btn like-btn">
                        ${viewerIcon('heart')}
                        <span>${post.likes_count||0}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>`;
}

function renderUserCard(u) {
    return `<div class="post-card flex items-center gap-3 cursor-pointer" data-action="profile" data-username="${escAttr(u.username)}">
        <div class="avatar" style="background:${getColor(u.username)}">${esc(u.username[0].toUpperCase())}</div>
        <div class="flex-1 min-w-0"><div class="font-bold">${esc(u.username)}</div><div class="text-dim text-sm truncate">${esc(u.bio||'')}</div></div>
        <div class="text-right text-xs text-dim flex-shrink-0"><div>${u.posts_count||0} posts</div><div>${u.followers_count||0} followers</div></div>
    </div>`;
}

// ---------------------------------------------------------------------------
// Global feed
// ---------------------------------------------------------------------------
async function loadGlobalFeed(reset=false) {
    if(feedLoading) return;
    if(reset) { feedCursor=null; document.getElementById('feed-content').innerHTML=''; }
    feedLoading=true;
    document.getElementById('feed-loading').style.display='block';
    try {
        let url=`api/feed/global?limit=30`;
        if(feedCursor) url+=`&cursor=${feedCursor}`;
        const res=await fetch(url);
        const data=await res.json();
        if(data.posts) {
            const container=document.getElementById('feed-content');
            data.posts.forEach(p=>container.insertAdjacentHTML('beforeend',renderPostCard(p)));
            feedCursor=data.next_cursor||null;
        }
        document.getElementById('feed-loading').style.display=feedCursor?'block':'none';
    } catch(e) { console.error(e); }
    feedLoading=false;
}

// ---------------------------------------------------------------------------
// Profile
// ---------------------------------------------------------------------------
async function openProfile(username) {
    showView('profile');
    document.getElementById('profile-displayname').textContent=username;
    document.getElementById('profile-postcount').textContent='Loading...';
    document.getElementById('profile-tab-content').innerHTML='<div class="p-6 text-center text-dim">Loading...</div>';
    try {
        const res=await fetch(`api/user/${username}`);
        if(!res.ok) { document.getElementById('profile-tab-content').innerHTML='<div class="p-6 text-center text-red-400">User not found</div>'; return; }
        const p=await res.json();
        document.getElementById('profile-avatar').textContent=username[0].toUpperCase();
        document.getElementById('profile-avatar').style.background=getColor(username);
        document.getElementById('profile-displayname').textContent=username;
        document.getElementById('profile-name2').textContent=username;
        document.getElementById('profile-username2').textContent='@'+username;
        document.getElementById('profile-postcount').textContent=(p.posts_count||0)+' posts';
        document.getElementById('profile-bio').textContent=p.bio||'No bio.';
        document.getElementById('profile-following').textContent=p.following_count||0;
        document.getElementById('profile-followers').textContent=p.followers_count||0;
        switchProfileTab('posts');
    } catch(e) { console.error(e); }
}

async function switchProfileTab(tab) {
    document.querySelectorAll('[id^="ptab-"]').forEach(t=>{t.classList.remove('active');});
    const el=document.getElementById('ptab-'+tab); if(el) el.classList.add('active');
    const username=document.getElementById('profile-username2').textContent.replace('@','');
    const container=document.getElementById('profile-tab-content');
    container.innerHTML='<div class="p-6 text-center text-dim">Loading...</div>';
    try {
        if(tab==='posts') {
            const res=await fetch(`api/feed/user/${username}?limit=50`);
            const data=await res.json();
            if(data.posts&&data.posts.length) { container.innerHTML=''; data.posts.forEach(p=>container.insertAdjacentHTML('beforeend',renderPostCard(p))); }
            else container.innerHTML='<div class="p-8 text-center text-dim">No posts yet.</div>';
        } else if(tab==='followers') {
            const res=await fetch(`api/user/${username}/followers`);
            const data=await res.json();
            container.innerHTML=(data.followers||[]).map(u=>renderUserCard(u)).join('')||'<div class="p-8 text-center text-dim">No followers.</div>';
        } else if(tab==='following') {
            const res=await fetch(`api/user/${username}/following`);
            const data=await res.json();
            container.innerHTML=(data.following||[]).map(u=>renderUserCard(u)).join('')||'<div class="p-8 text-center text-dim">Not following anyone.</div>';
        }
    } catch(e) { container.innerHTML='<div class="p-6 text-center text-red-400">Error loading.</div>'; }
}

// ---------------------------------------------------------------------------
// Thread view
// ---------------------------------------------------------------------------
async function openThread(postId) {
    showView('thread');
    const container=document.getElementById('thread-content');
    container.innerHTML='<div class="p-6 text-center text-dim">Loading thread...</div>';
    try {
        const res=await fetch(`api/post/${postId}/thread`);
        const data=await res.json();
        if(!data.thread||!data.thread.length) { container.innerHTML='<div class="p-6 text-center text-dim">Post not found.</div>'; return; }
        // Build tree
        const byId={}; const roots=[];
        data.thread.forEach(p=>{byId[p.id]={...p,children:[]};});
        data.thread.forEach(p=>{
            if(p.reply_to_id && byId[p.reply_to_id]) byId[p.reply_to_id].children.push(byId[p.id]);
            else roots.push(byId[p.id]);
        });
        let html='';
        function renderThread(node, depth=0) {
            const isFocus = node.id===data.focus_id;
            html += renderPostCard(node, {highlight: isFocus});
            if(node.children.length > 0) {
                html += '<div style="margin-left:'+(Math.min(depth+1,4)*16)+'px; border-left: 2px solid var(--border);">';
                node.children.forEach(c => renderThread(c, depth+1));
                html += '</div>';
            }
        }
        roots.forEach(r=>renderThread(r));
        container.innerHTML=html;
        // Scroll to focus post
        setTimeout(()=>{
            const focusEl=container.querySelector('.post-card.highlight');
            if(focusEl) focusEl.scrollIntoView({behavior:'smooth', block:'center'});
        }, 100);
    } catch(e) { container.innerHTML='<div class="p-6 text-center text-red-400">Error loading thread.</div>'; }
}

// ---------------------------------------------------------------------------
// User search
// ---------------------------------------------------------------------------
async function searchUsers(query) {
    if(!query.trim()) return;
    showView('explore');
    const container=document.getElementById('explore-content');
    container.innerHTML='<div class="text-center text-dim py-6">Searching...</div>';
    try {
        const res=await fetch(`api/users/search?q=${encodeURIComponent(query)}&limit=30`);
        const data=await res.json();
        if(!data.users||!data.users.length) { container.innerHTML='<div class="text-center text-dim py-6">No users found for "'+esc(query)+'".</div>'; return; }
        container.innerHTML='<div class="text-dim text-sm mb-3">'+data.users.length+' results for "'+esc(query)+'"</div>' +
            data.users.map(u=>renderUserCard(u)).join('');
    } catch(e) { container.innerHTML='<div class="text-center text-red-400 py-6">Search error.</div>'; }
}

// ---------------------------------------------------------------------------
// Users list
// ---------------------------------------------------------------------------
async function loadAllUsers() {
    showView('users');
    const container=document.getElementById('users-content');
    container.innerHTML='<div class="p-6 text-center text-dim">Loading users...</div>';
    try {
        const res=await fetch('api/users?limit=200');
        const data=await res.json();
        container.innerHTML=(data.users||[]).map(u=>renderUserCard(u)).join('')||'<div class="p-8 text-center text-dim">No users yet.</div>';
    } catch(e) { container.innerHTML='<div class="p-6 text-center text-red-400">Error.</div>'; }
}

// ---------------------------------------------------------------------------
// Admin view
// ---------------------------------------------------------------------------
async function loadAdmin() {
    showView('admin');
    const container=document.getElementById('admin-content');
    container.innerHTML='<div class="text-center text-dim py-6">Loading stats...</div>';
    try {
        const res=await fetch('api/stats');
        const s=await res.json();
        container.innerHTML=`
            <div class="grid grid-cols-3 gap-4 mb-6">
                <div class="bg-surface rounded-xl p-4 text-center"><div class="text-2xl font-bold">${s.user_count}</div><div class="text-dim text-sm">Users</div></div>
                <div class="bg-surface rounded-xl p-4 text-center"><div class="text-2xl font-bold">${s.post_count}</div><div class="text-dim text-sm">Posts</div></div>
                <div class="bg-surface rounded-xl p-4 text-center"><div class="text-2xl font-bold">${s.reply_count}</div><div class="text-dim text-sm">Replies</div></div>
                <div class="bg-surface rounded-xl p-4 text-center"><div class="text-2xl font-bold">${s.like_count}</div><div class="text-dim text-sm">Likes</div></div>
                <div class="bg-surface rounded-xl p-4 text-center"><div class="text-2xl font-bold">${s.repost_count}</div><div class="text-dim text-sm">Reposts</div></div>
                <div class="bg-surface rounded-xl p-4 text-center"><div class="text-2xl font-bold">${s.follow_count}</div><div class="text-dim text-sm">Follows</div></div>
            </div>
            <h3 class="font-bold text-lg mb-3">Most Active Users</h3>
            <div class="bg-surface rounded-xl divide-y divide-border mb-6">
                ${(s.top_users||[]).map((u,i)=>`
                    <div class="flex items-center gap-3 p-3 cursor-pointer hover:bg-hover" data-action="profile" data-username="${escAttr(u.username)}">
                        <span class="text-dim text-sm w-6 text-right">${i+1}.</span>
                        <div class="avatar" style="background:${getColor(u.username)};width:32px;height:32px;font-size:14px;">${esc(u.username[0].toUpperCase())}</div>
                        <div class="flex-1 font-bold text-sm">${esc(u.username)}</div>
                        <div class="text-dim text-xs">${u.posts_count} posts &middot; ${u.followers_count} followers</div>
                    </div>`).join('')}
            </div>
            <h3 class="font-bold text-lg mb-3">Most Liked Posts</h3>
            <div class="bg-surface rounded-xl divide-y divide-border">
                ${(s.top_posts||[]).map(p=>`
                    <div class="p-3 cursor-pointer hover:bg-hover" data-action="thread" data-id="${p.id}">
                        <div class="flex items-center gap-2 text-sm text-dim mb-1">
                            <span class="font-bold">${esc(p.username)}</span>
                            <span>&middot; ${p.likes_count} likes &middot; ${p.reposts_count} reposts &middot; ${p.reply_count} replies</span>
                        </div>
                        <div class="text-sm">${esc(p.content)}</div>
                    </div>`).join('')}
            </div>`;
    } catch(e) { container.innerHTML='<div class="text-center text-red-400 py-6">Error loading stats.</div>'; }
}

// ---------------------------------------------------------------------------
// Sidebar stats
// ---------------------------------------------------------------------------
async function loadSidebarStats() {
    try {
        const res=await fetch('api/stats');
        const s=await res.json();
        document.getElementById('sidebar-stats').innerHTML=`
            <div class="space-y-1">
                <div class="flex justify-between"><span>Users</span><span class="font-bold">${s.user_count}</span></div>
                <div class="flex justify-between"><span>Posts</span><span class="font-bold">${s.post_count}</span></div>
                <div class="flex justify-between"><span>Replies</span><span class="font-bold">${s.reply_count}</span></div>
                <div class="flex justify-between"><span>Likes</span><span class="font-bold">${s.like_count}</span></div>
                <div class="flex justify-between"><span>Follows</span><span class="font-bold">${s.follow_count}</span></div>
            </div>`;
        document.getElementById('sidebar-top-users').innerHTML=(s.top_users||[]).slice(0,5).map(u=>`
            <div class="flex items-center gap-2 cursor-pointer hover:bg-hover rounded-lg p-1 -mx-1" data-action="profile" data-username="${escAttr(u.username)}">
                <div class="avatar" style="background:${getColor(u.username)};width:32px;height:32px;font-size:14px;">${esc(u.username[0].toUpperCase())}</div>
                <div class="flex-1 min-w-0"><div class="font-bold text-sm truncate">${esc(u.username)}</div><div class="text-dim text-xs">${u.posts_count} posts</div></div>
            </div>`).join('');
    } catch(e) { console.error(e); }
}

// ---------------------------------------------------------------------------
// Infinite scroll
// ---------------------------------------------------------------------------
document.querySelector('main').addEventListener('scroll', ()=>{
    const main=document.querySelector('main');
    if(main.scrollTop+main.clientHeight >= main.scrollHeight-200) {
        const homeActive=document.getElementById('view-home').classList.contains('active');
        if(homeActive && feedCursor && !feedLoading) loadGlobalFeed();
    }
});

// ---------------------------------------------------------------------------
// Live refresh — re-render the home feed + stats in place so an ongoing
// simulation's new posts appear as they are written to the database. Skipped
// while the user is scrolled into the feed or a fetch is in flight, so
// reading and paging are never interrupted.
// ---------------------------------------------------------------------------
async function refreshGlobalFeed() {
    const main=document.querySelector('main');
    if(!document.getElementById('view-home').classList.contains('active')) return;
    if(feedLoading || main.scrollTop>50) return;
    try {
        const res=await fetch('api/feed/global?limit=30');
        const data=await res.json();
        if(data.posts) {
            document.getElementById('feed-content').innerHTML=data.posts.map(p=>renderPostCard(p)).join('');
            feedCursor=data.next_cursor||null;
        }
    } catch(e) { console.error(e); }
    loadSidebarStats();
}
setInterval(refreshGlobalFeed, 5000);

// ---------------------------------------------------------------------------
// Action wiring — data-action elements dispatch here instead of inline onclick.
// ---------------------------------------------------------------------------
wireActions({
    thread: d => openThread(Number(d.id)),
    profile: d => openProfile(d.username),
});

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
loadGlobalFeed(true);
loadSidebarStats();
</script>
</body>
</html>
