# @package sim

# LLM settings
llm:
  name: gpt-4o-mini
  temperature: 0.5
  api_base: null
  api_key: null
  disabled: false

max_concurrent_actions: 1000
sentence_encoder: sentence-transformers/all-MiniLM-L6-v2
memory_backend: list
action_mode: custom
tool_calling:
  mode: single                 # none | single | multi
prompt_additions:
  action_count_guidance: true

checkpoint:
  every_n_steps: null          # int | null
  explicit_steps: []           # list[int]
  resume_file: null            # optional checkpoint json path to resume from
  resume_step: null            # optional explicit start step override

engine:
  preset: base

  action_loop:
    built_in: single_action         # single_action | fixed_count | open_ended
    class_path: null
    params:
      count: 2                      # used by fixed_count
      max_actions: 3                # used by open_ended
      done_token: DONE              # used by open_ended

  probe_schedule:
    built_in: step_schedule         # step_schedule | fixed_interval | disabled
    class_path: null
    params:
      start_step: 0
      every_n_steps: 1

  flow_routing:
    flow_order: [fixed_pre, default]
    entity_to_flow: {}

  flow_policies: {}

roleplaying_instructions: |
  <general_instructions>
  You are simulating {name}, a character in a social science experiment.
  Always use third-person limited perspective when describing {name}'s thoughts and actions.
  Your goal is to determine the most appropriate actions {name} would take next.
  </general_instructions>
