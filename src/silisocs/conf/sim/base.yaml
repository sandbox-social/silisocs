# @package sim

# LLM settings
llm:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.5
  api_base: null
  api_key: null
  disabled: false
  extra_kwargs: {}
  # Optional cost reporting: token counts are always recorded in sim_metrics.json
  # (meta.llm_usage); set a pricing rate to also get estimated_cost_usd.
  # pricing: {input_per_1m: 2.5, output_per_1m: 10.0}

max_concurrent_actions: 1000
action_mode: custom
telemetry:
  # Retain each episode's active-agent NAME list in sim_metrics.json (and in
  # memory for the whole run). Counts are always recorded; the name lists are
  # O(active x steps), so they are off by default.
  record_active_agent_names: false
tool_calling:
  mode: single                 # none | single | multi
prompt_additions:
  action_count_guidance: true

# Runtime agent memory: how observations are recorded and how the prompt's
# Memory section is rendered. `window` (default) = today's last-N behavior;
# `retrieval` = a recent-window floor plus the most relevant older memories;
# `summarizing` = rolling summaries + retrieved older memories + a recent window.
# Orthogonal to initialization.agents (which SEEDS memories at step 0). Applies
# to NativeAgent.
memory:
  built_in: window             # window | retrieval | summarizing
  class_path: null
  params: {}

initialization:
  agents:
    built_in: default           # default | raw_memory | formative_memory | none
    class_path: null
    params: {}
  game_masters:
    built_in: default           # default | none
    class_path: null
    params: {}
  simulation:
    built_in: none              # none | seed_posts
    class_path: null
    params: {}

checkpoint:
  every_n_steps: null          # int | null
  explicit_steps: []           # list[int]
  source_run: null             # optional previous output directory to restore from
  auto_resume: true            # resume from THIS run's own output dir if it already has checkpoints; ignored when source_run is set
  save:
    # On-disk checkpoint layout: monolithic_json (one JSON per step, the
    # long-standing format) | sharded (manifest + NDJSON object shards + raw DB
    # sidecar files; params: objects_per_shard). Restore reads both transparently.
    built_in: monolithic_json
    class_path: null
    params: {}
  restore:
    built_in: social_action_event_replay
    class_path: null
    params: {}

engine:
  class_path: null
  params: {}
  # Turn executor: threads (one pool worker per in-flight turn, the default) |
  # asyncio (turns run as coroutines on one event loop; agents/models that
  # provide act_async / sample_*_async stay loop-native, sync-only ones run on
  # helper threads — both kinds mix freely in one step). max_concurrent_actions
  # keeps its meaning — max in-flight turns — under either executor.
  executor: threads
  loop:
    built_in: fixed_steps
    class_path: null
    params: {}
  step:
    # base | sequential | flow | multi_gm (concurrent flow-chain traversal,
    # the default) | multi_gm_serial (legacy flow-by-flow) | multi_gm_staged
    # (global per-stage barrier, supports empty/idle chain slots)
    built_in: base
    class_path: null
    params:
      flow_order: [fixed_pre, default]
      agent_to_flow: {}
      # Per-GM turn policies, keyed by GM name (same slot shape as the global
      # turn_policy). Lets a backend set its own action cadence, e.g. one action
      # in a "world" GM but open_ended in a social GM. Precedence: per-flow
      # (flow_turn_policies) > per-GM (this) > global turn_policy.
      gm_turn_policies: {}
      # Per-GM concurrency cap keyed by GM name; effective = min(cap, global
      # worker_limit); empty = global cap governs everything.
      gm_concurrency_caps: {}
  turn_policy:
    built_in: single_action         # single_action | fixed_count | open_ended
    class_path: null
    params: {}
  # Sim-level participation filter: which agents are in a step's roster at all,
  # applied before scheduling and before every GM's next_acting component.
  # all (pass-through) | activity_probability | activity_markov, or class_path
  # to a custom ParticipationPolicy. Policies are pure functions of
  # (agent_names, step_index, seed) — replay- and resume-stable. Set
  # built_in: all for deterministic/turn-based runs (e.g. fixed_order envs).
  participation:
    built_in: activity_probability
    class_path: null
    params:
      active_probability: null
      min_active_agents: 1
      activity_transition_rates:
        user:
          inactive_to_active: 0.3
          active_to_inactive: 0.3

roleplaying_instructions: |
  <general_instructions>
  You are simulating {name}, a character in a social science experiment.
  Always use third-person limited perspective when describing {name}'s thoughts and actions.
  Your goal is to determine the most appropriate actions {name} would take next.
  </general_instructions>
