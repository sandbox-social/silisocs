# @package sim

# LLM settings
llm:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.5
  api_base: null
  api_key: null
  disabled: false
  extra_kwargs: {}

max_concurrent_actions: 1000
action_mode: custom
tool_calling:
  mode: single                 # none | single | multi
prompt_additions:
  action_count_guidance: true

initialization:
  agents:
    built_in: default           # default | raw_memory | formative_memory | none
    class_path: null
    params: {}
  game_masters:
    built_in: default           # default | none
    class_path: null
    params: {}
  simulation:
    built_in: none              # none | seed_posts
    class_path: null
    params: {}

checkpoint:
  every_n_steps: null          # int | null
  explicit_steps: []           # list[int]
  source_run: null             # optional previous output directory to restore from
  auto_resume: true            # resume from THIS run's own output dir if it already has checkpoints; ignored when source_run is set
  restore:
    built_in: social_action_event_replay
    class_path: null
    params: {}

engine:
  class_path: null
  params: {}
  loop:
    built_in: fixed_steps
    class_path: null
    params: {}
  step:
    built_in: base                  # base | sequential | flow | multi_gm
    class_path: null
    params:
      flow_order: [fixed_pre, default]
      agent_to_flow: {}
  turn_policy:
    built_in: single_action         # single_action | fixed_count | open_ended
    class_path: null
    params: {}

roleplaying_instructions: |
  <general_instructions>
  You are simulating {name}, a character in a social science experiment.
  Always use third-person limited perspective when describing {name}'s thoughts and actions.
  Your goal is to determine the most appropriate actions {name} would take next.
  </general_instructions>
