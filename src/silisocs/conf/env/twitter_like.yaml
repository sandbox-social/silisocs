backend:
  type: twitter_like
  class_path: null
  params:
    perform_operations: false
    app_description: "You are currently operating on a Twitter like platform.\nYou\
      \ are allowed to perform the given actions, descriptions, and instructions on\
      \ how to perform them will follow.\nGenerally, to share content, you can write\
      \ a 'tweet' (a short post).\nTweets can be up to 280 characters long.\nYou can\
      \ reply to tweets, creating threaded conversations., and you can \nlike (favorite)\
      \ them to show appreciation, or \nrepost (retweet) tweets to share them with\
      \ your followers.\nYou can mention other users in your tweets using their @username.\n\
      You can follow other users to see their tweets in your home timeline.\nYou can\
      \ unfollow users if they no longer wish to see their content.\nGenerally, if\
      \ you don't want to take actions, or are done taking actions for a given step,\
      \ you can use the finished action to stop.\nSome of the above listed actions,\
      \ may not be available at thus step, or some other actions may also be available,\
      \ as described below.\ncurrent_user is always the full display name (e.g. \"\
      Alice Smith\").\nOnly use real post IDs from timeline/feed observations; do\
      \ not fabricate IDs.\nFor status/content fields, write in first person as the\
      \ character.\nOmit optional parameters you do not want to use.\nChoose actions\
      \ from those that are available:"
  enabled_actions: null
observation_history: 100
gm:
  components:
    initialize:
      built_in: social_media
      class_path: null
      params:
        graph:
          fully_connected_targets: []
          base_followership_probability: 0.3
          network_type: barabasi_albert
          barabasi_albert_m: 10
    next_acting:
      built_in: activity_probability
      class_path: null
      params:
        active_probability: null
        min_active_agents: 1
        activity_transition_rates:
          user:
            inactive_to_active: 0.3
            active_to_inactive: 0.3
    update:
      built_in: social_recommendation
      class_path: null
      params:
        default_recsys_type: null
        update_every_n_steps: 1
        lazy: true
        max_posts: 10
        user_context_recent_posts: 10
        include_like_trace: true
        like_trace_window: 10
        like_trace_weight: 0.5
        include_like_trace_in_context: false
    observe:
      built_in: timeline_every_turn
      class_path: null
      params:
        recsys_type: null
        timeline_mode: hybrid_recsys_follower
        timeline_posts: 10
        timeline_config:
          recsys_ratio: 0.6
          follower_ratio: 0.4
    resolve:
      built_in: tool_calling
      class_path: null
      params: {}
    action_prompt:
      built_in: default
      class_path: null
      params:
        action_prompt: "You are currently operating on a Twitter like platform.\n\
          You are allowed to perform the given actions, descriptions, and instructions\
          \ on how to perform them will follow.\nGenerally, to share content, you\
          \ can write a 'tweet' (a short post).\nTweets can be up to 280 characters\
          \ long.\nYou can reply to tweets, creating threaded conversations., and\
          \ you can \nlike (favorite) them to show appreciation, or \nrepost (retweet)\
          \ tweets to share them with your followers.\nYou can mention other users\
          \ in your tweets using their @username.\nYou can follow other users to see\
          \ their tweets in your home timeline.\nYou can unfollow users if they no\
          \ longer wish to see their content.\nGenerally, if you don't want to take\
          \ actions, or are done taking actions for a given step, you can use the\
          \ finished action to stop.\nSome of the above listed actions, may not be\
          \ available at thus step, or some other actions may also be available, as\
          \ described below.\ncurrent_user is always the full display name (e.g. \"\
          Alice Smith\").\nOnly use real post IDs from timeline/feed observations;\
          \ do not fabricate IDs.\nFor status/content fields, write in first person\
          \ as the character.\nOmit optional parameters you do not want to use.\n\
          Choose actions from those that are available:\n\n## AVAILABLE ACTIONS\n\
          1. POST - Share new content by creating a new tweet\n2. REPLY - Engage existing\
          \ content by responding to a tweet (needs post ID)\n3. REPOST - Extend the\
          \ reach of content by reposting someone's tweet (needs post ID)\n4. LIKE\
          \ - Show the world you appreciate content by liking a tweet (needs post\
          \ ID)\n\n## INSTRUCTIONS\nDetermine what ONE action {name} would take next\
          \ based on:\n- Their character and values via self-perception and goal descriptions\n\
          - The current context and timeline\n- Not repeating recent actions\nIf text-based,\
          \ the text must reflect their posting style description.\n\n[OUTPUT STYLE]"
        output_style: '## OUTPUT FORMAT

          Answer: {name}

          STEP 1: [Analyze {name}''s motivation based on their character]

          STEP 2: [Consider which posts/actions align with {name}''s values]

          STEP 3: [Determine the single most authentic action]


          FINAL DECISION:

          ACTION TYPE: [POST/REPLY/REPOST/LIKE]

          TARGET ID: [Include post ID if applicable]

          CONTENT: [For posts/replies, exact text {name} would write]

          REASONING: [Brief explanation of why this action fits {name}''s character]


          ## EXAMPLE OUTPUT

          STEP 1: {name} is motivated by her interest in educational initiatives and
          community engagement.

          STEP 2: Chris''s tweet about community priorities resonates with {name}''s
          values.

          STEP 3: Responding to Chris would allow {name} to engage meaningfully about
          community values.


          FINAL DECISION:

          ACTION TYPE: REPLY

          TARGET ID: 42

          CONTENT: "I appreciate your focus on community priorities, Chris! As an
          educator, I believe our growth depends on strong educational foundations
          alongside economic development."

          REASONING: This reply allows Emily to acknowledge community values while
          highlighting her educational perspective.

          '
  name: twitter_like_gm
  sim_role:
    name: social media game master
    module_path: silisocs.environments.gm.game_master
  class_path: silisocs.environments.gm.game_master.GameMaster
gm_orchestration:
  gms: []
  flow_bindings:
    flow_to_gms: {}
