observation_history: 100
gm:
  backend:
    type: twitter_like
    class_path: null
    params:
      perform_operations: false
      app_description: Twitter-like social backend. Agents can create posts, reply,
        like, repost, follow/unfollow, mute/unmute, search, inspect trends, report
        posts, update/view profiles, and finish an open-ended turn. By default all
        backend actions exposed with @app_action are available; restrict them with
        env.gm.backend.enabled_actions when a world needs a smaller action surface.
    enabled_actions: null
  components:
    initialize:
      built_in: social_media
      class_path: null
      params:
        graph:
          fully_connected_targets: []
          base_followership_probability: 0.3
          network_type: barabasi_albert
          barabasi_albert_m: 10
    next_acting:
      built_in: activity_probability
      class_path: null
      params:
        active_probability: null
        min_active_agents: 1
        activity_transition_rates:
          user:
            inactive_to_active: 0.3
            active_to_inactive: 0.3
    update:
      built_in: social_recommendation
      class_path: null
      params:
        default_recsys_type: null
        update_every_n_steps: 1
        lazy: true
        max_posts: 10
        user_context_recent_posts: 10
        include_like_trace: true
        like_trace_window: 10
        like_trace_weight: 0.5
        include_like_trace_in_context: false
    observe:
      built_in: timeline_every_turn
      class_path: null
      params:
        recsys_type: null
        timeline_mode: hybrid_recsys_follower
        timeline_posts: 10
        timeline_config:
          recsys_ratio: 0.6
          follower_ratio: 0.4
    resolve:
      built_in: tool_calling
      class_path: null
      params: {}
    action_prompt:
      built_in: default
      class_path: null
      params:
        action_prompt: 'You are operating on a Twitter-like social backend.


          The backend exposes actions as typed tools. By default, every @app_action
          on the backend is available. Scenarios can restrict the action surface with
          env.gm.backend.enabled_actions using canonical function names or selectable
          aliases.


          Common actions include create_tweet, reply_to_tweet, like_tweet, unlike_tweet,
          repost_tweet, quote_repost_tweet, follow_user, unfollow_user, mute_user,
          unmute_user, search_posts, get_trending_posts, report_post, update_profile,
          view_profile, do_nothing, and FINISHED.


          Use only real post IDs from timeline/feed observations; do not fabricate
          IDs. For status/content fields, write in first person as the character.
          Omit optional parameters you do not want to use.


          Determine what one action {name} would take next based on:

          - Their character, memories, and goals

          - The current context and timeline

          - Not repeating recent actions


          [OUTPUT STYLE]'
        output_style: '## OUTPUT FORMAT

          Answer: {name}

          STEP 1: [Analyze {name}''s motivation based on their character]

          STEP 2: [Consider which posts/actions align with {name}''s values]

          STEP 3: [Determine the single most authentic action]


          FINAL DECISION:

          ACTION TYPE: [chosen backend action]

          TARGET ID: [Include post ID if applicable]

          CONTENT: [For posts/replies, exact text {name} would write]

          REASONING: [Brief explanation of why this action fits {name}''s character]


          ## EXAMPLE OUTPUT

          STEP 1: {name} is motivated by her interest in educational initiatives and
          community engagement.

          STEP 2: Chris''s tweet about community priorities resonates with {name}''s
          values.

          STEP 3: Responding to Chris would allow {name} to engage meaningfully about
          community values.


          FINAL DECISION:

          ACTION TYPE: REPLY

          TARGET ID: 42

          CONTENT: "I appreciate your focus on community priorities, Chris! As an
          educator, I believe our growth depends on strong educational foundations
          alongside economic development."

          REASONING: This reply allows Emily to acknowledge community values while
          highlighting her educational perspective.

          '
  name: twitter_like_gm
  class_path: silisocs.environments.gm.game_master.ComponentGameMaster
