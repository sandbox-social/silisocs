# OASIS Twitter Platform Config
# @package env

defaults:
  - twitter_like
  - _self_

platform_type: twitter_like
app_module_path: silisocs.environments.backends.twitter_like.app
use_server: false

gamemaster:
  filename: social_media
  name: twitter_like_gm
  sim_role:
    name: social media game master
    module_path: silisocs.environments.gm.game_master

usage_instructions: |
  # OASIS Twitter-like Platform

  This is a Twitter-like social media platform supporting all OASIS-compatible actions.

  Actions Available:
  - POST: Create new tweets
  - LIKE/UNLIKE: Engage with tweets
  - DISLIKE/UNDO_DISLIKE: Negative reactions
  - REPOST: Share tweets
  - FOLLOW/UNFOLLOW: Social network
  - MUTE/UNMUTE: Hide content from users
  - SEARCH: Find posts
  - TRENDING: Get trending posts
  - REPORT: Flag inappropriate content

action_prompt: |
  # Twitter-like Platform Actions

  Available actions (use tool-calling format):
  - create_tweet(status: str) → {"success": bool, "post_id": int}
  - like_tweet(post_id: int) → {"success": bool}
  - unlike_post(post_id: int) → {"success": bool}
  - dislike_post(post_id: int) → {"success": bool}
  - undo_dislike_post(post_id: int) → {"success": bool}
  - follow_user(target_user: str) → {"success": bool}
  - unfollow_user(target_user: str) → {"success": bool}
  - mute_user(target_user: str) → {"success": bool}
  - unmute_user(target_user: str) → {"success": bool}
  - search_posts(query: str) → [posts...]
  - get_trending_posts() → [posts...]
  - report_post(post_id: int, reason: str) → {"success": bool}
  - do_nothing() → "Did nothing"