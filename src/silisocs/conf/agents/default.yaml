# @package agents

persona_pipeline:
  processing_mode: raw
  defaults:
    params:
      seed_post: ""
      bio: ""
      style: ""
      goal: null
      scenario_context: ${event.context}
    shared_memories:
      - They are an active user on a social media platform.
      - ${event.context}
  classes:
    user:
      count: ${num_agents}
      prefab_module: silisocs.agents.entity
      sim_role_name: user
      data:
        source: hf_dataset
        dataset: nvidia/Nemotron-Personas-USA
        split: train
      field_map:
        context: persona
    fixed_seed:
      count: 0
      prefab_module: silisocs.agents.fixed_entity
      sim_role_name: fixed_seed
      flow_tag: null
      params: {}
    llm_user:
      count: 0
      prefab_module: silisocs.agents.entity
      sim_role_name: llm_user
      flow_tag: null
      data:
        source: inline
        records: []
      field_map:
        context: persona

shared_memories:
  - They are an active user on a social media platform.
  - ${event.context}

initial_observations:
  - "{name} is at home checking their social media feed."
  - "{name} decides to browse and maybe post something."
