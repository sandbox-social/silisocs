<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Silisocs Studio{% endblock %}</title>
  <link rel="stylesheet" href="/assets/tokens.css">
  <script>document.documentElement.dataset.theme=localStorage.getItem('silisocs-theme')||'light';window.paletteCommands=[];window.registerPaletteCommand=command=>window.paletteCommands.push(command)</script>
  <script src="/assets/plotly.js"></script>
  <script src="/assets/cytoscape.js"></script>
</head>
<body>
  <aside class="rail">
    <a class="wordmark" href="/"><span>SI</span><b>Silisocs</b><small>Studio</small></a>
    <nav aria-label="Primary">
      <a class="{{ 'active' if active == 'home' }}" href="/"><i>⌂</i>Home</a>
      <a class="{{ 'active' if active == 'scenarios' }}" href="/scenarios"><i>◇</i>Scenarios</a>
      <a class="{{ 'active' if active == 'runs' }}" href="/runs"><i>▶</i>Runs</a>
      <a class="{{ 'active' if active == 'studies' }}" href="/studies"><i>⌁</i>Studies</a>
      <a class="{{ 'active' if active == 'live' }}" href="/live"><i>●</i>Live</a>
      {% for page in plugin_pages|default([]) %}<a href="{{ page.href }}"><i>+</i>{{ page.label }}</a>{% endfor %}
    </nav>
    <div class="rail-foot"><span class="status-dot"></span><span>Local workspace</span><a href="/settings" title="Settings">Settings</a></div>
  </aside>
  <main class="shell">
    <header class="topbar"><div class="crumb">{% block crumb %}Workspace{% endblock %}</div><div class="top-actions"><button class="icon-button" type="button" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">◐</button><button class="icon-button" type="button" onclick="openPalette()" title="Command palette" aria-label="Command palette">⌘</button><a class="icon-button" href="/api/docs" title="API documentation">?</a></div></header>
    <div class="content">{% block content %}{% endblock %}</div>
  </main>
  <dialog id="command-palette" class="command-palette"><input id="command-search" type="search" placeholder="Jump to…" aria-label="Search commands"><nav><a href="/">Home</a><a href="/scenarios">Scenarios</a><a href="/runs">Runs</a><a href="/studies">Studies</a><a href="/live">Live</a><a href="/settings">Settings</a><a href="/scenarios/new">Create scenario</a><a href="/studies/new">Create study</a></nav></dialog>
  <script>
    const nativeFetch=window.fetch.bind(window);window.fetch=(input,options={})=>{const method=(options.method||'GET').toUpperCase();if(['POST','PUT','PATCH','DELETE'].includes(method)){const token=localStorage.getItem('silisocs-auth-token');if(token){options.headers=new Headers(options.headers||{});options.headers.set('authorization',`Bearer ${token}`)}}return nativeFetch(input,options)};
    function chartTheme(){const css=getComputedStyle(document.documentElement),muted=css.getPropertyValue('--muted').trim(),border=css.getPropertyValue('--border').trim();return{'font.color':muted,'xaxis.gridcolor':border,'xaxis.zerolinecolor':border,'yaxis.gridcolor':border,'yaxis.zerolinecolor':border}}
    window.toggleTheme=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('silisocs-theme',next);document.querySelectorAll('[data-figure]').forEach(el=>window.Plotly?.relayout(el,chartTheme()));document.getElementById('platform-frame')?.contentWindow?.postMessage({type:'silisocs-theme',theme:next},'*')};
    window.notify=(message,tone='neutral')=>{const el=document.createElement('div');el.className=`toast ${tone}`;el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),3000)};
    const pendingPaletteCommands=window.paletteCommands;window.registerPaletteCommand=({label,href,keywords='',action})=>{const nav=document.querySelector('#command-palette nav'),item=document.createElement(href?'a':'button');if(href)item.href=href;else item.type='button';item.textContent=label;item.dataset.keywords=keywords;if(action)item.addEventListener('click',()=>{document.getElementById('command-palette').close();action()});nav.append(item);return item};pendingPaletteCommands.forEach(registerPaletteCommand);
    async function hydratePalette(){const nav=document.querySelector('#command-palette nav');if(nav.dataset.loaded)return;nav.dataset.loaded='true';const sources=[['/api/runs','Run',item=>'/runs/'+item.id.split('/').map(encodeURIComponent).join('/')],['/api/scenarios','Scenario',item=>'/scenarios/'+encodeURIComponent(item.name)],['/api/studies','Study',item=>'/studies/'+encodeURIComponent(item.id)]];for(const [url,kind,href] of sources){try{const data=await (await fetch(url)).json();for(const item of data.items||[])registerPaletteCommand({label:`${kind}: ${item.scenario||item.name||item.id}`,href:href(item),keywords:item.id||''})}catch{}}}
    window.openPalette=()=>{const dialog=document.getElementById('command-palette');dialog.showModal();document.getElementById('command-search').focus();hydratePalette()};
    document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openPalette()}if(event.key==='Escape')document.getElementById('command-palette').close()});
    document.getElementById('command-search').addEventListener('input',event=>{const value=event.target.value.toLowerCase();document.querySelectorAll('#command-palette nav>a,#command-palette nav>button').forEach(item=>item.hidden=!`${item.textContent} ${item.dataset.keywords||''}`.toLowerCase().includes(value))});
    // Figure layouts arrive fully templated from the server (design.plotly).
    document.querySelectorAll('[data-figure]').forEach((el) => {
      const figure = JSON.parse(el.dataset.figure);
      const layout=figure.layout||{},theme=chartTheme();layout.font={...(layout.font||{}),color:theme['font.color']};layout.xaxis={...(layout.xaxis||{}),gridcolor:theme['xaxis.gridcolor'],zerolinecolor:theme['xaxis.zerolinecolor']};layout.yaxis={...(layout.yaxis||{}),gridcolor:theme['yaxis.gridcolor'],zerolinecolor:theme['yaxis.zerolinecolor']};
      Plotly.newPlot(el, figure.data || [], layout, {responsive:true,displaylogo:false,modeBarButtonsToRemove:['lasso2d','select2d']});
    });
    // Shell-owned panel controls: rewrite p.<panel>.<param> in the URL and reload.
    window.setPanelParam = (panel, param, value) => {
      const url = new URL(window.location);
      if (value === '' || value === null) url.searchParams.delete(`p.${panel}.${param}`);
      else url.searchParams.set(`p.${panel}.${param}`, value);
      window.location = url;
    };
    // Network panels emit a payload attribute; the shell owns initialization.
    document.querySelectorAll('[data-cy-graph]').forEach((el) => {
      if (!window.cytoscape) return;
      const graph = JSON.parse(el.dataset.cyGraph);
      cytoscape({container: el, elements: graph.elements || [], style: graph.style || [],
                 layout: {name: 'preset'}, wheelSensitivity: 0.2});
    });
  </script>
</body>
</html>
