# @package agent_situation

setting:
  name: Generic Community
  background:
    - A general-purpose social media community where people discuss everyday topics.

event:
  name: Daily discussion
  context: |
    Users are participating in everyday social media discussions.
    They share opinions, news, and engage with each other's content.

data: {}

persona_pipeline:
  processing_mode: raw
  defaults:
    params:
      seed_post: ""
      bio: ""
      style: ""
      goal: null
      scenario_context: ${agent_situation.event.context}
    shared_memories:
      - They are an active user on a social media platform.
      - ${agent_situation.event.context}
  classes:
    user:
      count: ${num_agents}
      prefab_module: mastodon_sim.agents.entity
      sim_role_name: user
      data:
        source: hf_dataset
        dataset: nvidia/Nemotron-Personas-USA
        split: train
      field_map:
        context: persona
    fixed_seed:
      count: 0
      prefab_module: mastodon_sim.agents.fixed_entity
      sim_role_name: fixed_seed
      flow_tag: null
      params: {}
    llm_user:
      count: 0
      prefab_module: mastodon_sim.agents.entity
      sim_role_name: llm_user
      flow_tag: null
      data:
        source: inline
        records: []
      field_map:
        context: persona

shared_memories:
  - They are an active user on a social media platform.
  - ${agent_situation.event.context}

initial_observations:
  - "{name} is at home checking their social media feed."
  - "{name} decides to browse and maybe post something."
