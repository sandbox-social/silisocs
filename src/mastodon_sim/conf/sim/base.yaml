# sim/base.yaml — core simulation parameters (platform-agnostic)
# @package sim

num_agents: 100
num_steps: 50
run_name: run1
seed: 1

# Set at runtime by Hydra / runner
output_rootname: ""

# Scenario metadata and narrative context
scenario_name: default
agent_situation_name: default
jobname_format: "N${sim.num_agents}_T${sim.num_steps}_${experiment_name}_${sim.run_name}"

setting:
  name: Generic Community
  background:
    - A general-purpose social media community where people discuss everyday topics.

event:
  name: Daily discussion
  context: |
    Users are participating in everyday social media discussions.
    They share opinions, news, and engage with each other's content.

data: {}

# Optional scenario-specific entities / metadata
news_account: {}
candidates: {}
partisan_types: []
