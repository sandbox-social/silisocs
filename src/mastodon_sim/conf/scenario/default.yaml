# scenario/default.yaml — generic social simulation scenario
# @package scenario
#
# This is the default scenario config shipped with the library.
# It defines a simple social discussion simulation with agents
# sourced from HuggingFace personas. Override in your own
# scenarios/<name>/conf/ to customize.

scenario_name: default

jobname_format: "N${sim.num_agents}_T${sim.num_steps}_${experiment_name}_${sim.run_name}"

# Setting information
setting:
  name: Generic Community
  background:
    - A general-purpose social media community where people discuss everyday topics.

event:
  name: Daily discussion
  context: |
    Users are participating in everyday social media discussions.
    They share opinions, news, and engage with each other's content.

persona_pipeline:
  processing_mode: raw
  defaults:
    params:
      seed_post: ""
      bio: ""
      style: ""
      goal: null
      scenario_context: ${scenario.event.context}
    shared_memories:
      - They are an active user on a social media platform.
      - ${scenario.event.context}
  classes:
    user:
      count: ${sim.num_agents}
      prefab_module: mastodon_sim.agents.entity
      sim_role_name: user
      data:
        source: hf_dataset
        dataset: nvidia/Nemotron-Personas-USA
        split: train
      field_map:
        context: persona

social_network:
  activity_transition_rates:
    user:
      inactive_to_active: 0.3
      active_to_inactive: 0.3
  fully_connected_targets: []
  base_followership_probability: 0.3
  network_type: barabasi_albert
  barabasi_albert_m: 10

shared_memories:
  - They are an active user on a social media platform.
  - ${scenario.event.context}

initial_observations:
  - "{name} is at home checking their social media feed."
  - "{name} decides to browse and maybe post something."

probes: {}
