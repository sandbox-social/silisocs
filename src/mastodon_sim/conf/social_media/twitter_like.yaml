# src/conf/social_media/twitter_like.yaml
# Twitter-like social media platform configuration

# Platform type for the app factory
platform_type: twitter_like
app_module_path: mastodon_sim.environments.backends.twitter_like

# Server configuration (not applicable for local SQLite-based platforms)
use_server: false

# Game master configuration
gamemaster:
  filename: social_media
  name: twitter_like_gm
  sim_role:
    name: social media game master
    module_path: mastodon_sim.environments.gm.game_master

# Platform instructions
usage_instructions: |
  You are currently operating on a Twitter like platform.
  You are allowed to perform the given actions, descriptions, and instructions on how to perform them will follow.
  Generally, to share content, you can write a 'tweet' (a short post).
  Tweets can be up to 280 characters long.
  You can reply to tweets, creating threaded conversations., and you can 
  like (favorite) them to show appreciation, or 
  repost (retweet) tweets to share them with your followers.
  You can mention other users in your tweets using their @username.
  You can follow other users to see their tweets in your home timeline.
  You can unfollow users if they no longer wish to see their content.
  Generally, if you don't want to take actions, or are done taking actions for a given step, you can use the finished action to stop.
  Some of the above listed actions, may not be available at thus step, or some other actions may also be available, as described below.
  current_user is always the full display name (e.g. "Alice Smith").
  Only use real post IDs from timeline/feed observations; do not fabricate IDs.
  For status/content fields, write in first person as the character.
  Omit optional parameters you do not want to use.
  Choose actions from those that are available:

# Action prompt template
action_prompt: |
  ## AVAILABLE ACTIONS
  1. POST - Share new content by creating a new tweet
  2. REPLY - Engage existing content by responding to a tweet (needs post ID)
  3. REPOST - Extend the reach of content by reposting someone's tweet (needs post ID)
  4. LIKE - Show the world you appreciate content by liking a tweet (needs post ID)

  ## INSTRUCTIONS
  Determine what ONE action {name} would take next based on:
  - Their character and values via self-perception and goal descriptions
  - The current context and timeline
  - Not repeating recent actions
  If text-based, the text must reflect their posting style description.

  [OUTPUT STYLE]

# Output style: how to format the response (stripped when tool-calling is enabled)
output_style: |
  ## OUTPUT FORMAT
  Answer: {name}
  STEP 1: [Analyze {name}'s motivation based on their character]
  STEP 2: [Consider which posts/actions align with {name}'s values]
  STEP 3: [Determine the single most authentic action]

  FINAL DECISION:
  ACTION TYPE: [POST/REPLY/REPOST/LIKE]
  TARGET ID: [Include post ID if applicable]
  CONTENT: [For posts/replies, exact text {name} would write]
  REASONING: [Brief explanation of why this action fits {name}'s character]

  ## EXAMPLE OUTPUT
  STEP 1: {name} is motivated by her interest in educational initiatives and community engagement.
  STEP 2: Chris's tweet about community priorities resonates with {name}'s values.
  STEP 3: Responding to Chris would allow {name} to engage meaningfully about community values.

  FINAL DECISION:
  ACTION TYPE: REPLY
  TARGET ID: 42
  CONTENT: "I appreciate your focus on community priorities, Chris! As an educator, I believe our growth depends on strong educational foundations alongside economic development."
  REASONING: This reply allows Emily to acknowledge community values while highlighting her educational perspective.
