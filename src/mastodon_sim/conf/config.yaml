# Top-level Hydra configuration for mastodon-sim
# Choose between preset configurations using Hydra overrides:
#   python -m mastodon_sim.runtime.runner  # Uses sim=base, social_media=twitter_like (default)
#   python -m mastodon_sim.runtime.runner sim=oasis  # Alternative (now same as base)

defaults:
  - sim: base
  - social_media: twitter_like
  - scenario: default
  - _self_

hydra:
  job:
    name: ${scenario.scenario_name}_${now:%Y-%m-%d_%H-%M-%S}
  run:
    dir: scenarios/${scenario.scenario_name}/outputs/${scenario.jobname_format}
  output_subdir: configs/${scenario.jobname_format}

experiment_name: independent

