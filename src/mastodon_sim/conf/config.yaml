# Top-level Hydra configuration for mastodon-sim
# Allows switching between 'default' and 'oasis' presets

defaults:
  - sim: base
  - social_media: oasis_reddit  # OASIS Reddit as default (most tested platform)
  - scenario: default
  - _self_
hydra:
  job:
    name: ${scenario.jobname_format}_${now:%Y-%m-%d_%H-%M-%S}
  run:
    dir: scenarios/${scenario.scenario_name}/outputs/${scenario.jobname_format}
  output_subdir: configs/${scenario.jobname_format}

experiment_name: independent

