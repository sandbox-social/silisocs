# Top-level Hydra configuration for mastodon-sim
# Choose between preset configurations using Hydra overrides:
#   python -m mastodon_sim.runtime.runner --config-path scenarios/misinformation/conf
#   python -m mastodon_sim.runtime.runner --config-path scenarios/misinformation/conf agents=thin

defaults:
  - scenario: default
  - agents: default
  - llm: base
  - simulator: base
  - env: twitter_like
  - evals: base
  - _self_

hydra:
  job:
    name: ${scenario_name}_${now:%Y-%m-%d_%H-%M-%S}
  run:
    dir: scenarios/${scenario_name}/outputs/${jobname_format}
  output_subdir: configs/${jobname_format}

experiment_name: independent
