
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Sim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .feed-container { max-width: 600px; margin: 0 auto; }
        .post-card { border-bottom: 1px solid #e5e7eb; padding: 1rem; }
        .post-card:hover { background-color: #f9fafb; cursor: pointer; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col p-4">
            <h1 class="text-2xl font-bold text-blue-600 mb-6">SkyConnect</h1>
            <nav class="space-y-4">
                <a href="#" onclick="loadGlobalFeed()" class="flex items-center space-x-2 text-xl font-semibold hover:text-blue-500">
                    <span>🏠 Home</span>
                </a>
                <a href="#" onclick="loadGlobalFeed()" class="flex items-center space-x-2 text-xl font-semibold hover:text-blue-500">
                    <span>🌐 Global Feed</span>
                </a>
            </nav>
            <div class="mt-auto">
                <input type="text" id="usernameInput" placeholder="View as user..." class="w-full p-2 border rounded">
            </div>
        </div>

        <!-- Main Feed -->
        <div class="flex-1 overflow-y-auto no-scrollbar" id="mainScroll">
            <div class="feed-container bg-white min-h-full border-x border-gray-200">
                <header class="sticky top-0 bg-white/80 backdrop-blur-md border-b border-gray-200 p-4 z-10 flex justifying-between items-center">
                    <h2 class="text-xl font-bold" id="feedTitle">Global Feed</h2>
                    <button onclick="refreshFeed()" class="text-blue-500 hover:text-blue-700">Refresh</button>
                </header>
                
                <div id="feedContent" class="divide-y divide-gray-200">
                    <!-- Posts go here -->
                </div>
                
                <div class="p-4 text-center text-gray-500" id="loading">Loading...</div>
            </div>
        </div>

        <!-- Right Sidebar (Stats/Trending) -->
        <div class="w-80 bg-white border-l border-gray-200 hidden lg:block p-4">
            <h3 class="font-bold text-gray-500 mb-4">Trending Users</h3>
            <div id="trendingContent">
                <div class="text-sm text-gray-400">Not implemented yet</div>
            </div>
        </div>
    </div>

    <script>
        let currentCursor = null;
        let currentMode = 'global'; // 'global', 'home', 'user'
        let currentUser = null; // viewing as
        let targetUser = null; // viewing profile of

        const feedContent = document.getElementById('feedContent');
        const feedTitle = document.getElementById('feedTitle');

        async function fetchFeed(reset = false) {
            if (reset) {
                currentCursor = null;
                feedContent.innerHTML = '';
            }

            let url = `/api/feed/global?limit=20`;
            if (currentMode === 'home' && currentUser) {
                url = `/api/feed/home/${currentUser}?limit=20`;
            } else if (currentMode === 'user' && targetUser) {
                url = `/api/feed/user/${targetUser}?limit=20`;
            }

            if (currentCursor) {
                url += `&cursor=${currentCursor}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.posts) {
                    renderPosts(data.posts);
                    currentCursor = data.next_cursor;
                }
                document.getElementById('loading').style.display = data.next_cursor ? 'block' : 'none';
            } catch (error) {
                console.error("Error fetching feed:", error);
            }
        }

        function renderPosts(posts) {
            posts.forEach(post => {
                const div = document.createElement('div');
                div.className = 'post-card';
                div.innerHTML = `
                    <div class="flex space-x-3">
                        <div class="flex-shrink-0">
                            <div class="h-10 w-10 rounded-full bg-gray-300 flex items-center justify-center font-bold text-white">
                                ${post.username[0].toUpperCase()}
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center space-x-2">
                                <span class="font-bold hover:underline cursor-pointer" onclick="loadUserProfile('${post.username}')">${post.username}</span>
                                <span class="text-gray-500 text-sm">· ${timeSince(post.created_at * 1000)}</span>
                            </div>
                            <div class="mt-1 text-gray-900 text-lg leading-snug">
                                ${post.content}
                            </div>
                            <div class="mt-3 flex space-x-8 text-gray-500 text-sm">
                                <button class="hover:text-blue-500 flex items-center space-x-1">
                                    <span>💬</span> <span>${post.reply_count}</span>
                                </button>
                                <button class="hover:text-green-500 flex items-center space-x-1">
                                    <span>Fail-safe icon 🔄</span> <span>${post.reposts_count}</span>
                                </button>
                                <button class="hover:text-red-500 flex items-center space-x-1">
                                    <span>❤️</span> <span>${post.likes_count}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                feedContent.appendChild(div);
            });
        }

        function loadGlobalFeed() {
            currentMode = 'global';
            feedTitle.innerText = 'Global Feed';
            fetchFeed(true);
        }

        function loadUserProfile(username) {
            currentMode = 'user';
            targetUser = username;
            feedTitle.innerText = `${username}'s Posts`;
            fetchFeed(true);
        }

        function refreshFeed() {
            fetchFeed(true);
        }

        // Utils
        function timeSince(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + "y";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + "mo";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + "d";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + "h";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + "m";
            return Math.floor(seconds) + "s";
        }

        // Infinite Scroll
        const mainScroll = document.getElementById('mainScroll');
        mainScroll.addEventListener('scroll', () => {
            if (mainScroll.scrollTop + mainScroll.clientHeight >= mainScroll.scrollHeight - 100) {
                if (currentCursor) {
                    fetchFeed();
                }
            }
        });

        // Initial Load
        loadGlobalFeed();

    </script>
</body>
</html>
