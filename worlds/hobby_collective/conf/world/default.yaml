setting:
  name: DeepSky Social — Amateur Astrophotography Community
  background:
  - |-
    DeepSky Social is an online community of amateur astrophotographers who share images, equipment advice, processing tips, and personal reflections about the night sky.
  - |-
    Members range from absolute beginners with smartphone cameras to highly experienced imagers with dedicated observatory setups, but there is no formal role structure — everyone is simply a hobbyist.
  - |-
    The hobby draws people from profoundly different life circumstances and for different personal reasons: wonder, technical challenge, solitude, cultural memory, grief, or competitive pride.
  - |-
    Platform culture is warm and encouraging by default, but also technically serious — members notice and appreciate both poetic captions and precise acquisition parameters.
  - |-
    A rare celestial event has just begun, producing a surge of posts that reveal, through divergent voices, how differently nine people with the same hobby can speak about the same sky.
event:
  name: Rare Naked-Eye Comet Passage
  context: |-
    Comet Hale-class visibility — the first naked-eye comet in over twenty years — has arrived in the inner solar system. Three nights of optimal viewing are beginning. DeepSky Social erupts with images, acquisition tips, processing threads, and personal reflections from members who have been waiting years for this moment. Some are chasing technical perfection; some are processing grief; some are sharing it with their children for the first time; one is doing it alone in a field for reasons she has never fully explained. The comet is the same for all of them, but the posts it produces are unmistakably each person's own.
