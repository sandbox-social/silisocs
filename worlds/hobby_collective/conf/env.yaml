gm:
  backend:
    type: twitter_like
    class_path: null
    params: {}
    enabled_actions:
    - create_tweet
    - reply_to_tweet
    - like_tweet
    - repost_tweet
    - FINISHED
  components:
    initialize:
      built_in: social_media
      class_path: null
      params:
        graph:
          fully_connected_targets: []
          base_followership_probability: 0.6
          network_type: barabasi_albert
          barabasi_albert_m: 2
    next_acting:
      built_in: activity_probability
      class_path: null
      params:
        activity_transition_rates:
          hobbyist:
            inactive_to_active: 0.65
            active_to_inactive: 0.25
    observe:
      built_in: timeline_every_turn
      class_path: null
      params:
        episode_observation_flows:
        - fixed_pre
        timeline_mode: follower_chronological
    resolve:
      built_in: tool_calling
      class_path: null
      params: {}
    update:
      built_in: social_recommendation
      class_path: null
      params: {}
    action_prompt:
      built_in: default
      class_path: null
      params: {}
  class_path: silisocs.environments.gm.game_master.ComponentGameMaster
