site_name: Social Simulation Sandbox
site_description: Configurable generative agent simulation of social media using the Concordia framework
site_url: https://social-sandbox.github.io/mastodon-sim
repo_url: https://github.com/social-sandbox/mastodon-sim
repo_name: social-sandbox/mastodon-sim

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
  - User Guide:
    - Usage Overview: usage.md
    - Configuration: configuration.md
    - Environment Layer: environment_layer.md
    - Building Agents: building_agents.md
    - Memory Initialization: memory_initialization.md
    - Social Media Backends: backends.md
    - Evaluation Probes: probes.md
    - Dashboard: dashboard.md
  - Tutorials:
    - Election Scenario Walkthrough: tutorials/election.md
  - Development:
    - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/social-sandbox/mastodon-sim
