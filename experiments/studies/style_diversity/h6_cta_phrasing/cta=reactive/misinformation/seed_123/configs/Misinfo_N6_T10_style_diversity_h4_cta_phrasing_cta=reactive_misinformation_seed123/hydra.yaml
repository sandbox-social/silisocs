hydra:
  run:
    dir: outputs/${scenario_name}/${jobname_format}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: configs/${jobname_format}
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - seed=123
    - run_name="style_diversity_h4_cta_phrasing_cta=reactive_misinformation_seed123"
    - experiment_name=style_diversity
    - env=cta_reactive
    - num_steps=10
    - sim.llm.name=gpt-4o-mini
  job:
    name: ${scenario_name}_${now:%Y-%m-%d_%H-%M-%S}
    chdir: null
    override_dirname: env=cta_reactive,experiment_name=style_diversity,num_steps=10,run_name="style_diversity_h4_cta_phrasing_cta=reactive_misinformation_seed123",seed=123,sim.llm.name=gpt-4o-mini
    id: ???
    num: ???
    config_name: experiment
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /mnt/c/Users/maxpu/Dropbox/scripts/Projects/socialsandbox/mastodon-sim
    config_sources:
    - path: /mnt/c/Users/maxpu/Dropbox/scripts/Projects/socialsandbox/mastodon-sim/scenarios/misinformation/conf
      schema: file
      provider: file
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /mnt/c/Users/maxpu/Dropbox/scripts/Projects/socialsandbox/mastodon-sim/src/silisocs/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /mnt/c/Users/maxpu/Dropbox/scripts/Projects/socialsandbox/mastodon-sim/outputs/misinformation/Misinfo_N6_T10_style_diversity_h4_cta_phrasing_cta=reactive_misinformation_seed123
    choices:
      evals: base
      env: cta_reactive
      sim: base
      agents: default
      scenario: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
