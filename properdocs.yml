site_name: SiliSocS
site_description: "SiliSocS (Silicon Society Sandbox): a configurable, extensible framework for multi-agent social simulation, structured around the EASE decomposition of Environment, Agents, Simulation engine, and Evaluation."
site_url: https://sandbox-social.github.io/silisocs
repo_url: https://github.com/sandbox-social/silisocs
repo_name: sandbox-social/silisocs
exclude_docs: |

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Exact brand hex (violet -> teal) is applied in stylesheets/silisocs.css via
    # --md-* CSS variables; the named colors below are the nearest base.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.tabs
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/silisocs.css

extra_javascript:
  - javascripts/network-hero.js

plugins:
  - search
  - literate-nav
  # Branded social/OG link-preview cards. Disabled by default because card
  # generation needs the imaging stack (cairosvg + pillow + system Cairo). To
  # enable in CI: install the docs group (which now includes those deps) and set
  # `enabled: true` here. With `enabled: false` the plugin imports no imaging libs.
  - social:
      enabled: false
      cards_layout_options:
        background_color: "#0d9488"
        color: "#ffffff"
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: sphinx
            preload_modules:
              - silisocs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
    - Upgrading: upgrading.md
  - User Guide:
    - Usage Overview: usage.md
    - Scenario Guide: scenario_guide.md
    - Study Guide: study_guide.md
    - Study Schema: study_schema.md
    - Experiment Studies: experiments.md
    - Configuration: configuration.md
    - Config Reference (Generated): config_reference.md
    - Documentation Coverage: documentation_coverage.md
    - Framework Roadmap: framework_roadmap.md
    - Simulation Extensibility API: simulation_extensibility_api.md
    - Concordia Bridge: concordia_bridge.md
    - Concordia Migration Log: concordia_migration_log.md
    - Environment Layer: environment_layer.md
    - Multi-GM Architecture: multi_gm_architecture.md
    - Building Agents: building_agents.md
    - Harness Agents (experimental): harness_agents.md
    - Memory Initialization: memory_initialization.md
    - Environment Backends: backends.md
    - Evaluation Probes: probes.md
    - Studio: studio.md
    - Studio Analysis Panels: analysis_panels.md
  - Tutorials:
    - Election Scenario Walkthrough: tutorials/election.md
  - Development:
    - Contributing: contributing.md
    - Architecture Decisions:
      - Native Core and Concordia Boundary: adr/0001-native-core-concordia-compatibility-boundary.md
      - Engine-Owned Initialization: adr/0002-engine-owned-initialization-lifecycle.md
      - Checkpoint-Owned Restore: adr/0003-checkpoint-owned-restore.md
      - Async Event-Driven Engine Mode: adr/0004-async-event-driven-engine-mode.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sandbox-social/silisocs
