site_name: Silicon Society Sandbox
site_description: Configurable native generative-agent simulations with optional Concordia compatibility
site_url: https://sandbox-social.github.io/silisocs
repo_url: https://github.com/sandbox-social/silisocs
repo_name: sandbox-social/silisocs
exclude_docs: |

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - literate-nav
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: sphinx
            preload_modules:
              - silisocs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
  - User Guide:
    - Usage Overview: usage.md
    - Scenario Guide: scenario_guide.md
    - Study Guide: study_guide.md
    - Study Schema: study_schema.md
    - Experiment Studies: experiments.md
    - Configuration: configuration.md
    - Documentation Coverage: documentation_coverage.md
    - Framework Roadmap: framework_roadmap.md
    - Simulation Extensibility API: simulation_extensibility_api.md
    - Concordia Bridge: concordia_bridge.md
    - Concordia Migration Log: concordia_migration_log.md
    - Environment Layer: environment_layer.md
    - Multi-GM Architecture: multi_gm_architecture.md
    - Building Agents: building_agents.md
    - Memory Initialization: memory_initialization.md
    - Environment Backends: backends.md
    - Evaluation Probes: probes.md
    - Dashboard: dashboard.md
  - Tutorials:
    - Election Scenario Walkthrough: tutorials/election.md
  - Development:
    - Contributing: contributing.md
    - Architecture Decisions:
      - Native Core and Concordia Boundary: adr/0001-native-core-concordia-compatibility-boundary.md
      - Engine-Owned Initialization: adr/0002-engine-owned-initialization-lifecycle.md
      - Checkpoint-Owned Restore: adr/0003-checkpoint-owned-restore.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sandbox-social/silisocs
