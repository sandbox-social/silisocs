[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silisocs"
version = "0.1.0"
description = "A native social simulation framework for configurable social-media experiments"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Austin Welch", email = "austinmw89@gmail.com"}]
keywords = ["agent-based simulation", "social simulation", "llm", "social media"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "coloredlogs>=15.0.1",
  "openai>=1.35.9,<2.0.0",
  "tqdm>=4.66.4,<5.0.0",
  "termcolor>=2.4.0,<3.0.0",
  "docstring-parser>=0.16,<0.17",
  "networkx>=3.3,<4.0.0",
  "requests>=2.32.3,<3.0.0",
  "psutil>=7.0,<8.0.0",
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "omegaconf>=2.3.0,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "hydra-core>=1.3.2,<2.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
concordia = [
  "gdm-concordia>=2.1.0,<2.2.0",
]
analysis = [
  "dash>=2.18.2,<3.0.0",
  "dash-cytoscape>=1.0.2,<2.0.0",
  "ipympl>=0.9.4,<0.10.0",
  "matplotlib>=3.9.1,<4.0.0",
  "nbformat>=5.10.4,<6.0.0",
  "plotly>=5.22.0,<6.0.0",
  "powerlaw>=1.5,<2.0.0",
  "python-louvain>=0.16,<0.17",
  "scipy>=1.14.1,<2.0.0",
  "seaborn>=0.13.2,<0.14.0",
  "tiktoken>=0.7.0,<0.8.0",
]
dashboard = [
  "streamlit>=1.45.1,<2.0.0",
]
docs = [
  "properdocs>=1.6.7",
  "mkdocs-autorefs>=1.4.4",
  "mkdocs-gen-files>=0.6.1",
  "mkdocs-literate-nav>=0.6.3",
  "mkdocs-material>=9.7.6",
  "mkdocstrings-python>=2.0.3",
  "pymdown-extensions>=10.21.2",
]
hf = [
  "datasets>=4.5.0,<5.0.0",
]
mastodon = [
  "loguru>=0.7.2,<0.8.0",
  "mastodon-py>=1.8.1,<2.0.0",
  "pyvis==0.3.1",
]
recsys = [
  "scikit-learn>=1.5.0,<2.0.0",
  "scipy>=1.14.1,<2.0.0",
  "sentence-transformers>=3.0.1,<4.0.0",
]
viz = [
  "fastapi[all]>=0.110.1",
  "gunicorn>=21.2.0",
  "jinja2>=3.1.4,<4.0.0",
  "uvicorn[standard]>=0.29.0",
]
aws = [
  "boto3>=1.34.139,<2.0.0",
]
all = [
  "silisocs[analysis,concordia,dashboard,docs,hf,mastodon,recsys,viz]",
]

[project.urls]
Documentation = "https://sandbox-social.github.io/silisocs"
Repository = "https://github.com/sandbox-social/silisocs"

[project.scripts]
silisocs = "silisocs.runtime.runner:cli_main"
silisocs-config-dry-run = "silisocs.runtime.config_dry_run:main"


[dependency-groups]
test = [
  "coverage[toml]>=7.4.4",
  "mypy>=1.9.0",
  "pre-commit>=3.7.0",
  "pytest>=8.1.1",
  "pytest-mock>=3.14.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.3.5",
]
dev = [
  "commitizen>=3.27.0,<4.0.0",
  "cruft>=2.15.0",
  "cz-conventional-gitmoji>=0.3.2,<0.4.0",
  "ipykernel>=6.29.4",
  "ipywidgets>=8.1.2",
  "isort>=5.13.2,<6.0.0",
  "poethepoet>=0.25.0",
  "types-pyyaml>=6.0.12.20241230",
  "types-requests>=2.32.0.20241016",
]
docs = [
  "properdocs>=1.6.7",
  "mkdocs-material>=9.5.0,<10.0.0",
  "mkdocstrings[python]>=0.24.0,<1.0.0",
  "mkdocs-gen-files>=0.5.0,<1.0.0",
  "mkdocs-literate-nav>=0.6.0,<1.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["silisocs*"]

[tool.setuptools.package-data]
silisocs = [
  "conf/**/*.yaml",
  "environments/backends/**/templates/*.html",
]

[tool.uv]
default-groups = ["test"]

[tool.commitizen]  # https://commitizen-tools.github.io/commitizen/config/
name = "cz_gitmoji"
bump_message = "bump(release): v$current_version → v$new_version"
tag_format = "v$version"
update_changelog_on_bump = true
version_provider = "pep621"

[tool.coverage.report]  # https://coverage.readthedocs.io/en/latest/config.html#report
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run]  # https://coverage.readthedocs.io/en/latest/config.html#run
branch = true
command_line = "--module pytest -m 'not llm_e2e'"
data_file = "reports/.coverage"
source = ["src/silisocs"]

[tool.coverage.xml]  # https://coverage.readthedocs.io/en/latest/config.html#xml
output = "reports/coverage.xml"

[tool.mypy]  # https://mypy.readthedocs.io/en/latest/config_file.html
junit_xml = "reports/mypy.xml"
plugins = "pydantic.mypy"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true

[tool.pytest.ini_options]  # https://docs.pytest.org/en/latest/reference/reference.html#ini-options-ref
addopts = "--color=yes --doctest-modules --exitfirst --failed-first --verbosity=2 --junitxml=reports/pytest.xml -m 'not llm_e2e'"
required_plugins = ["pytest-xdist"]
testpaths = ["tests"]
xfail_strict = true
markers = [
  "llm_e2e: real-LLM end-to-end simulation tests (opt-in, expensive)",
]

[tool.ruff]  # https://github.com/charliermarsh/ruff
fix = true
line-length = 100
src = ["src", "tests"]
target-version = "py311"
exclude = ["./concordia"]

[tool.ruff.lint]
ignore-init-module-imports = true
select = ["A", "ASYNC", "B", "C4", "C90", "D", "DTZ", "E", "F", "FLY", "FURB", "I", "ISC", "LOG", "N", "NPY", "PERF", "PGH", "PIE", "PL", "PT", "Q", "RET", "RUF", "RSE", "SIM", "TID", "UP", "W", "YTT"]
ignore = ["D203", "D213", "E501", "PGH002", "PGH003", "RET504", "S101", "S307"]
unfixable = ["F401", "F841"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "numpy"


[tool.poe.tasks]  # https://github.com/nat-n/poethepoet

  [tool.poe.tasks.api]
  help = "Serve the REST API"
  shell = """
    if [ $dev ]
    then {
      uvicorn \
        --host $host \
        --port $port \
        --reload \
        silisocs.api:app
    } else {
      gunicorn \
        --access-logfile - \
        --bind $host:$port \
        --graceful-timeout 10 \
        --keep-alive 10 \
        --log-file - \
        --timeout 30 \
        --worker-class uvicorn.workers.UvicornWorker \
        --worker-tmp-dir /dev/shm \
        --workers 2 \
        silisocs.api:app
    } fi
    """

    [[tool.poe.tasks.api.args]]
    help = "Bind socket to this host (default: 0.0.0.0)"
    name = "host"
    options = ["--host"]
    default = "0.0.0.0"

    [[tool.poe.tasks.api.args]]
    help = "Bind socket to this port (default: 8000)"
    name = "port"
    options = ["--port"]
    default = "8000"

    [[tool.poe.tasks.api.args]]
    help = "Enable development mode"
    type = "boolean"
    name = "dev"
    options = ["--dev"]

  [tool.poe.tasks.docs]
  help = "Build the documentation site"
  cmd = "properdocs build --strict"

  [tool.poe.tasks.lint]
  help = "Lint this app"

    [[tool.poe.tasks.lint.sequence]]
    cmd = """
      pre-commit run
        --all-files
        --color always
      """

  [tool.poe.tasks.test]
  help = "Test this app"

    [[tool.poe.tasks.test.sequence]]
    cmd = "coverage run"

    [[tool.poe.tasks.test.sequence]]
    cmd = "coverage report"

    [[tool.poe.tasks.test.sequence]]
    cmd = "coverage xml"

  [tool.poe.tasks.ci]
  help = "Run lint + tests under Python 3.12 (mirrors CI matrix)"
  sequence = [
    { ref = "lint" },
    { cmd = "uv run --python 3.12 pytest" },
  ]
